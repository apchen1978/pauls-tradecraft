      function showFeedback() {
        const panel = $("feedback");
        if (selected < 0) { panel.hidden = true; panel.replaceChildren(); return; }
        const c = COPY[lang];
        const item = c.choices[selected];
        const h = document.createElement("h3"); h.textContent = c.clearsLabel;
        const p = document.createElement("p"); p.textContent = item.clears;
        const h2 = document.createElement("h3"); h2.textContent = c.remainsLabel; h2.style.marginTop = "18px";
        const p2 = document.createElement("p"); p2.className = "quiet"; p2.textContent = item.remains;
        panel.replaceChildren(h, p, h2, p2);
        panel.hidden = false;
      }
      function render() {
        const c = COPY[lang];
        document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
        document.title = c.title + " | Paul's Tradecraft";
        for (const [id, value] of Object.entries({
          eyebrow: c.eyebrow, lead: c.lead,
          "hero-question": c.heroQuestion, "hero-note": c.heroNote,
          "cover-signal-label": c.coverSignalLabel, "cover-signal": c.coverSignal,
          "cover-order-label": c.coverOrderLabel, "cover-order": c.coverOrder,
          "buyer-label": c.buyerLabel, "buyer-message": c.buyerMessage,
          "said-title": c.saidTitle, "unknown-title": c.unknownTitle,
          "follow-up-intro": c.followUpIntro,
          "follow-up-a-label": c.followUpA.label, "follow-up-a-message": c.followUpA.message,
          "follow-up-a-next-title": c.followUpA.nextTitle, "follow-up-a-next": c.followUpA.next,
          "follow-up-b-label": c.followUpB.label, "follow-up-b-message": c.followUpB.message,
          "follow-up-b-next-title": c.followUpB.nextTitle, "follow-up-b-next": c.followUpB.next,
          "follow-up-disclosure": c.followUpDisclosure,
          "prepare-title": c.prepareTitle, "prepare-body": c.prepareBody,
          "decision-title": c.decisionTitle, "decision-body": c.decisionBody,
          "exercise-one": c.exerciseOne, "exercise-two": c.exerciseTwo,
          closing: c.closing, disclosure: c.disclosure
        })) $(id).textContent = value;
        const title = $("page-title");
        title.setAttribute("aria-label", c.title);
        title.replaceChildren(...c.titleLines.map(line => { const span = document.createElement("span"); span.className = "title-line"; span.textContent = line; return span; }));
        c.steps.forEach((value, i) => { $("step-" + ["one","two","three","four"][i]).textContent = value; });
        c.headings.forEach((value, i) => { $("step-" + ["one","two","three","four"][i] + "-title").textContent = value; });
        c.intros.forEach((value, i) => { $("step-" + ["one","two","three","four"][i] + "-intro").textContent = value; });
        setList("said-list", c.said);
        setList("unknown-list", c.unknown);
        $("answer-one").placeholder = c.placeholderOne;
        $("answer-two").placeholder = c.placeholderTwo;
        const list = $("choices");
        list.replaceChildren(...c.choices.map((item, i) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "choice";
          button.setAttribute("aria-pressed", String(selected === i));
          const mark = document.createElement("span"); mark.className = "mark"; mark.setAttribute("aria-hidden", "true"); mark.textContent = "0" + (i + 1);
          const label = document.createElement("span"); label.textContent = item.label;
          button.append(mark, label);
          button.addEventListener("click", () => { selected = i; render(); list.children[i].focus(); });
          return button;
        }));
        showFeedback();
        document.querySelectorAll(".lang button").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.lang === lang)));
      }
      document.querySelectorAll(".lang button").forEach(button => button.addEventListener("click", () => {
        lang = button.dataset.lang;
        try { const url = new URL(location.href); url.searchParams.set("lang", lang); history.replaceState(null, "", url); } catch (_) {}
        render();
      }));
      render();
    })();
  </script>
</body>
</html>
