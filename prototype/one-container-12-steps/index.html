<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>一個貨櫃出海前的 12 步 · 12 Steps Before One Container Ships — Paul's Tradecraft</title>
  <style>
    :root {
      --paper: #f6f3ed;
      --ink: #193a35;
      --muted: #5b6a63;
      --line: #d4dad1;
      --pine: #142c29;
      --brass: #8a6a2b;
      --surface: #ffffff;
      --soft: #dde7de;
      --warn: #f3e9d2;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
    .page { width: min(100% - 32px, 960px); margin: 0 auto; padding: 32px 0 72px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .lang { display: flex; gap: 6px; }
    .lang button {
      min-width: 44px; min-height: 36px; padding: 4px 10px; white-space: nowrap; flex-shrink: 0;
      font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
    }
    .lang button[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--paper); }
    .badge {
      display: inline-block; margin-top: 18px; padding: 4px 10px;
      border: 1px solid var(--line); border-radius: 3px; color: var(--muted);
      font-size: 12px; font-weight: 700; letter-spacing: .06em;
    }
    h1, h2, h3 { margin: 0; font-family: "Noto Serif TC", "PMingLiU", Georgia, serif; font-weight: 600; letter-spacing: -.03em; line-height: 1.25; }
    h1 { margin-top: 18px; font-size: clamp(32px, 6vw, 48px); }
    h2 { font-size: clamp(24px, 4.4vw, 32px); }
    h3 { font-size: 19px; }
    .lede { margin: 16px 0 0; max-width: 36em; font-size: 18px; }
    .caveat { margin: 14px 0 0; max-width: 40em; color: var(--muted); font-size: 14px; }
    .jump { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 0; padding: 0; list-style: none; }
    .jump a {
      display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px;
      border: 1px solid var(--pine); border-radius: 999px; text-decoration: none; font-size: 14px; font-weight: 700;
    }
    .jump a:hover { background: var(--pine); color: var(--paper); }
    section.block { margin-top: 56px; border-top: 1px solid var(--ink); padding-top: 26px; scroll-margin-top: 16px; }
    .block-lede { margin: 10px 0 0; max-width: 40em; color: var(--muted); font-size: 16px; }

    .steps { display: grid; gap: 16px; margin: 26px 0 0; padding: 0; list-style: none; }
    .step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .step-head { display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px 4px; }
    .num {
      flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
      background: var(--pine); color: var(--paper); font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .step-head p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
    .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 14px 0 0; border-top: 1px solid var(--line); }
    .col { padding: 14px 20px 16px; border-left: 1px solid var(--line); }
    .col:first-child { border-left: 0; }
    .col h4 { margin: 0 0 4px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    .col p { margin: 0; font-size: 15px; }
    .col.risk { background: #faf6ec; }
    .terms { margin: 0; padding: 10px 20px; border-top: 1px dashed var(--line); background: var(--paper); color: var(--muted); font-size: 13px; }
    .terms b { color: var(--ink); }

    .cuts { display: grid; gap: 14px; margin: 24px 0 0; }
    .cut-group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
    .cut-group > h3 { margin-bottom: 4px; }
    .cut-group > .sub { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .term-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; }
    .term-list li { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
    .term-list .t { font-weight: 700; }
    .term-list .d { font-size: 15px; }
    .term-list .d small { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
    .countdown { margin: 22px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; counter-reset: c; }
    .countdown li { padding: 12px 12px; border: 1px solid var(--pine); border-radius: 10px; background: var(--surface); font-size: 14px; font-weight: 700; text-align: center; }
    .countdown li:last-child { background: var(--pine); color: var(--paper); }
    .countdown-note { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .danger { margin: 22px 0 0; padding: 16px 20px; background: var(--warn); border-radius: 12px; }
    .danger h3 { font-size: 17px; }
    .danger ul { margin: 10px 0 0; padding-left: 1.2em; }
    .danger li { margin: 6px 0; font-size: 15px; }

    .asks { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: q; }
    .asks li {
      counter-increment: q; display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start;
      padding: 16px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 16px;
    }
    .asks li::before {
      content: counter(q); display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid var(--pine); font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .asks small { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }

    .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 22px;
      border: 1px solid var(--pine); border-radius: 8px; background: var(--pine); color: var(--paper);
      font-weight: 700; text-decoration: none;
    }
    .btn:hover { filter: brightness(1.15); }
    .btn.ghost { background: transparent; color: var(--ink); }
    .btn.ghost:hover { background: var(--soft); filter: none; }
    .boundary { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

    @media (max-width: 720px) {
      .cols { grid-template-columns: 1fr; }
      .col { border-left: 0; border-top: 1px solid var(--line); padding: 12px 20px; }
      .col:first-child { border-top: 0; }
      .countdown { grid-template-columns: repeat(2, 1fr); }
      .term-list li { grid-template-columns: 1fr; gap: 2px; }
      .step-head { padding: 16px 16px 4px; }
      .col, .terms, .cut-group, .asks li { padding-left: 16px; padding-right: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

    <div class="top">

    </section>

    <div class="row" id="actions"></div>
    <p class="boundary" id="boundary"></p>
  </main>
