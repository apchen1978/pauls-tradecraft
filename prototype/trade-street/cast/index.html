<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>貿易街的人 — Paul's Tradecraft</title>
  <meta name="description" content="一櫃貨出海，靠整條街的人接力。認識貿易街的八個人：貨代、船公司、工廠、拖車、報關行、碼頭調度、買家，還有帶你走一趟的導覽員。人物是虛構的，名字是暫名。" />
  <link rel="canonical" href="https://paulstradecraft.com/prototype/trade-street/cast/" />
  <link rel="icon" href="data:," />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Paul's Tradecraft" />
  <meta property="og:title" content="貿易街的人 · The People of Trade Street" />
  <meta property="og:description" content="一櫃貨出海，靠整條街的人接力。認識街上的八個人，再走一趟。" />
  <meta property="og:url" content="https://paulstradecraft.com/prototype/trade-street/cast/" />
  <meta property="og:image" content="https://paulstradecraft.com/prototype/trade-street/assets/trade-street-map.webp" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:locale:alternate" content="en_US" />
  <style>
    :root {
      --salt: #F3F7F6; --white: #ffffff; --sky: #DCEBEE; --ink: #12323A; --teal: #1E7F86; --deep: #0E4A52;
      --moss: #54686C; --line: #CBDADD; --amber: #B9761C;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--salt); color: var(--ink);
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", "WenQuanYi Micro Hei", "Droid Sans Fallback", ui-sans-serif, system-ui, sans-serif;
      font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased;
    }
    html:lang(en) body { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Noto Sans", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    button, a { font: inherit; }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
    .skip { position: absolute; left: 12px; top: 12px; transform: translateY(-160%); background: var(--white); color: var(--ink); padding: 8px 12px; border-radius: 8px; font-weight: 700; text-decoration: none; }
    .skip:focus { transform: none; }
    .page { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 72px; }
    .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
    .eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--deep); }
    .lang { display: flex; gap: 8px; }
    .lang button { min-width: 48px; min-height: 40px; padding: 4px 14px; border: 2px solid var(--deep); border-radius: 999px; background: transparent; color: var(--deep); font-weight: 700; cursor: pointer; }
    .lang button[aria-pressed="true"] { background: var(--deep); color: var(--white); }
    .boundary { display: block; margin: 18px 0 0; padding: 8px 12px; border: 2px dashed var(--teal); border-radius: 10px; color: var(--deep); font-size: 14px; font-weight: 600; line-height: 1.5; max-width: 760px; }
    h1 { margin: 20px 0 0; font-size: clamp(34px, 7vw, 52px); line-height: 1.15; letter-spacing: -.02em; }
    .intro { margin: 14px 0 0; max-width: 680px; font-size: 19px; font-weight: 600; }
    .lede { margin: 10px 0 0; max-width: 680px; color: var(--moss); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 18px; }
    .primary { display: inline-flex; align-items: center; min-height: 48px; padding: 8px 22px; border-radius: 999px; border: 2px solid var(--deep); background: var(--deep); color: var(--white); font-weight: 700; text-decoration: none; }
    .link { color: var(--deep); font-weight: 700; }
    .roster { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none; }
    .roster a { display: inline-flex; align-items: center; min-height: 40px; padding: 4px 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--white); color: var(--ink); font-size: 15px; font-weight: 700; text-decoration: none; }
    .roster a:hover { border-color: var(--teal); background: var(--sky); }
    .grid { display: grid; gap: 22px; margin: 26px 0 0; padding: 0; list-style: none; grid-template-columns: 1fr; }
    @media (min-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1040px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 18px; } }
    .person { display: grid; grid-template-columns: 128px 1fr; gap: 0 14px; padding: 14px; border: 3px solid var(--deep); border-radius: 18px; background: var(--white); scroll-margin-top: 16px; }
    @media (min-width: 1040px) { .person { grid-template-columns: 1fr; padding: 0; overflow: hidden; } }
    .person:target { box-shadow: 0 0 0 5px rgba(185, 118, 28, .45); }
    .figure { display: flex; align-items: flex-end; justify-content: center; align-self: start; border-radius: 14px; padding: 8px 4px 0; background: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--accent) 22%, var(--sky)) 0%, var(--sky) 70%); }
    @media (min-width: 1040px) { .figure { border-radius: 0; padding: 18px 8px 0; min-height: 360px; border-bottom: 3px solid var(--deep); } }
    .figure img { display: block; width: auto; max-width: 100%; height: 280px; object-fit: contain; }
    @media (min-width: 1040px) { .figure img { height: 330px; } }
    @media (prefers-reduced-motion: no-preference) { .figure img { transition: transform .35s ease; } .person:hover .figure img { transform: translateY(-4px) scale(1.02); } }
    .info { min-width: 0; }
    @media (min-width: 1040px) { .info { padding: 16px 16px 18px; } }
    .role { display: inline-block; margin: 0; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--white); font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .person h2 { margin: 8px 0 0; font-size: 24px; line-height: 1.25; }
    .person h2 a { color: inherit; text-decoration: none; }
    .person h2 a:hover { text-decoration: underline; }
    .blurb { margin: 8px 0 0; color: var(--moss); font-size: 15px; line-height: 1.55; }
    dl { margin: 10px 0 0; display: grid; gap: 8px; }
    dt { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--deep); }
    dd { margin: 0; font-size: 15px; line-height: 1.5; }
    .say { font-weight: 600; }
    .cta { margin-top: 34px; padding: 20px; border: 3px solid var(--deep); border-radius: 18px; background: var(--white); }
    .cta h2 { margin: 0; font-size: 22px; }
    .cta p { margin: 8px 0 0; color: var(--moss); }
    .caveat { margin-top: 24px; color: var(--moss); font-size: 14px; max-width: 760px; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <a class="skip" id="skip" href="#main">跳至內容</a>
  <main class="page" id="main">
    <header class="top">
      <p class="eyebrow" id="eyebrow">作品館 · 教學玩具</p>
      <div class="lang" id="lang-group" role="group" aria-label="語言">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>
    <p class="boundary" id="boundary"></p>
    <h1 id="title" tabindex="-1">貿易街的人</h1>
    <p class="intro" id="intro"></p>
    <p class="lede" id="lede"></p>
    <div class="actions">
      <a class="primary" id="play-top" href="../">走一趟貿易街</a>
    </div>
    <nav aria-label="八個人" id="roster-nav"><ul class="roster" id="roster"></ul></nav>
    <ol class="grid" id="grid"></ol>
    <section class="cta" aria-labelledby="cta-title">
      <h2 id="cta-title"></h2>
      <p id="cta-text"></p>
      <div class="actions">
        <a class="primary" id="play-bottom" href="../">走一趟貿易街</a>
        <a class="link" id="home" href="/#showcase">回到作品館</a>
      </div>
    </section>
    <p class="caveat" id="caveat"></p>
  </main>
  <script type="module" src="cast.js"></script>
</body>
</html>
