  <style>
    :root {
      --salt: #F3F7F6;
      --white: #ffffff;
      --sky: #DCEBEE;
      --ink: #12323A;
      --teal: #1E7F86;

      --moss: #54686C;
      --line: #CBDADD;
      --amber: #B9761C;
      --amber-fill: #965F0D;
      --amber-soft: #F6E7CB;
      --red: #B2452F;
      --red-soft: #F4D9D2;
      --green: #2F7D4F;

      --off: #D9E1E3;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;

      color: var(--ink);
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", "WenQuanYi Micro Hei", "Droid Sans Fallback", ui-sans-serif, system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    html:lang(en) body { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Noto Sans", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    button, a { font: inherit; }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
    .skip { position: absolute; left: 12px; top: 12px; transform: translateY(-160%); background: var(--white); color: var(--ink); padding: 8px 12px; border-radius: 8px; font-weight: 700; text-decoration: none; }
    .skip:focus { transform: none; }
    .page { width: min(880px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 72px; }

    .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
    .eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--deep); }
    .lang { display: flex; gap: 8px; }
    .lang button { min-width: 48px; min-height: 40px; padding: 4px 14px; border: 2px solid var(--deep); border-radius: 999px; background: transparent; color: var(--deep); font-weight: 700; cursor: pointer; }
    .lang button[aria-pressed="true"] { background: var(--deep); color: var(--white); }
    .boundary { display: block; margin: 18px 0 0; padding: 8px 12px; border: 2px dashed var(--teal); border-radius: 10px; color: var(--deep); font-size: 14px; font-weight: 600; line-height: 1.5; }
    h1 { margin: 20px 0 0; font-size: clamp(34px, 7vw, 48px); line-height: 1.15; letter-spacing: -.02em; }

    .intro { margin: 14px 0 0; font-size: 19px; font-weight: 600; }
    .lede { margin: 10px 0 0; color: var(--moss); }

    .scn { display: grid; gap: 10px; margin-top: 14px; }
    @media (min-width: 640px) { .scn { grid-template-columns: repeat(3, 1fr); } }
    .scn button { text-align: left; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); color: var(--ink); cursor: pointer; min-height: 72px; }
    .scn button strong { display: block; font-size: 17px; }

    .scn button[aria-checked="true"] { border-color: var(--teal); background: var(--sky); box-shadow: 0 0 0 2px var(--teal) inset; }

    @media (min-width: 640px) { .route { grid-template-columns: repeat(4, 1fr); gap: 10px; } }
    .route li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); font-size: 15px; line-height: 1.35; min-height: 52px; }
    .route .num { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--sky); color: var(--deep); font-weight: 700; font-size: 14px; }

    .route li { position: relative; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 18px; }
    .primary, .secondary { min-height: 48px; padding: 8px 20px; border-radius: 999px; border: 2px solid var(--deep); font-weight: 700; cursor: pointer; }
    .primary { background: var(--deep); color: var(--white); }
    .secondary { background: transparent; color: var(--deep); }
    .primary:disabled { opacity: .5; cursor: default; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); }
    .progress { margin: 0; font-weight: 700; }
    .buffer { display: flex; align-items: center; gap: 6px; }

    .buffer .cell.gone { background: transparent; border-color: var(--off); }
    .buffer small { font-size: 13px; color: var(--moss); margin-left: 4px; }
    .lights { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; }
    .lights li { display: flex; align-items: center; gap: 6px; font-size: 14px; }
    .lamp { width: 16px; height: 16px; border-radius: 50%; background: var(--off); border: 2px solid var(--off); }
    .lamp.green { background: var(--green); border-color: var(--green); }
    .lamp.amber { background: var(--amber); border-color: var(--amber); }
    .lamp.red { background: var(--red); border-color: var(--red); }

    .speaker { display: flex; align-items: center; gap: 12px; }

    .speaker b { display: block; font-size: 17px; line-height: 1.3; }
    .speaker span { display: block; color: var(--moss); font-size: 14px; line-height: 1.3; }
    .say { margin: 12px 0 0; padding: 10px 14px; border-left: 4px solid var(--teal); background: var(--sky); border-radius: 0 10px 10px 0; font-weight: 600; }
    .step-title { margin: 14px 0 0; font-size: 20px; line-height: 1.35; }
    .step-p { margin: 6px 0 0; color: var(--moss); }
    .scn-note { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--amber-soft); color: #6b4510; font-size: 15px; }
    .brief { margin: 12px 0 0; display: grid; gap: 8px; }
    .brief div { padding: 8px 12px; border-radius: 10px; background: var(--salt); font-size: 15px; line-height: 1.5; }
    .brief b { display: block; font-size: 13px; letter-spacing: .06em; color: var(--deep); }
    .prompt { margin: 16px 0 0; font-size: 19px; font-weight: 700; }
    .choices { display: grid; gap: 10px; margin-top: 10px; }
    .choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); color: var(--ink); cursor: pointer; min-height: 56px; }
    .choice:hover:not(:disabled) { border-color: var(--teal); }
    .choice .letter { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--sky); color: var(--deep); font-weight: 700; font-size: 14px; }
    .choice:disabled { cursor: default; }
    .choice.picked { border-color: var(--teal); background: var(--sky); }
    .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--green); background: var(--green-soft); }
    .feedback.costly { border-color: var(--amber); background: var(--amber-soft); }
    .feedback.costly2 { border-color: var(--red); background: var(--red-soft); }
    .feedback p { margin: 0; }
    .feedback p + p { margin-top: 8px; }
    .feedback b { color: var(--deep); }
    .text-btn { margin-top: 12px; padding: 6px 2px; border: 0; background: transparent; color: var(--deep); font-weight: 700; text-decoration: underline; cursor: pointer; min-height: 40px; }
    .card { margin-top: 14px; padding: 20px; border: 3px solid var(--deep); border-radius: 18px; background: var(--white); }
    .card-kicker { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: #7A4C0C; }
    .card .speaker { margin-top: 12px; }
    .card .avatar { width: 72px; height: 72px; font-size: 28px; }
    .tier { margin: 16px 0 0; font-size: 26px; line-height: 1.25; }
    .tier.clear { color: var(--green); }
    .tier.tight { color: var(--amber); }
    .tier.missed { color: var(--red); }
    .style-line { margin: 8px 0 0; font-weight: 600; }
    .picks { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
    .picks li { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 8px 10px; border-radius: 10px; background: var(--salt); font-size: 15px; line-height: 1.45; }
    .picks li small { color: var(--moss); display: block; }
    .picks .cost { align-self: center; font-weight: 700; color: var(--green); white-space: nowrap; }
    .picks .cost.on { color: var(--red); }
    .worst { margin: 14px 0 0; font-weight: 600; }
    .card-boundary { margin: 14px 0 0; padding-top: 12px; border-top: 2px dashed var(--line); font-size: 14px; color: var(--moss); }
    .status { min-height: 1.5em; margin: 8px 0 0; font-size: 15px; color: var(--deep); }
    .cast { display: grid; gap: 10px; margin-top: 12px; padding: 0; list-style: none; }
    @media (min-width: 640px) { .cast { grid-template-columns: repeat(2, 1fr); } }
    .cast li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); }
    .cast .avatar { width: 44px; height: 44px; font-size: 18px; }
    .cast b { display: block; line-height: 1.3; }
    .cast small { display: block; color: var(--moss); font-size: 14px; line-height: 1.45; }
    .primer { max-width: 660px; margin: 18px 0 0; padding: 14px 16px; border-left: 5px solid var(--teal); border-radius: 4px 12px 12px 4px; background: var(--sky); }
    .primer summary { cursor: pointer; font-size: 16px; font-weight: 700; line-height: 1.4; color: var(--deep); }
    .primer p { margin: 8px 0 0; font-size: 16px; line-height: 1.65; color: var(--ink); }
    @media (max-width: 639px) { .primer { margin-top: 12px; padding: 10px 12px; } }
    .takeaway { max-width: 660px; margin: 22px 0 0; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); }
    .takeaway h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.35; color: var(--deep); }
    .takeaway ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; line-height: 1.6; }
    .takeaway p { margin: 10px 0 0; }
    .caveat { margin-top: 28px; color: var(--moss); font-size: 14px; }
    .home { display: inline-block; margin-top: 12px; color: var(--deep); font-weight: 700; }
    .map-stage { position: relative; margin-top: 16px; border: 3px solid var(--deep); border-radius: 16px; overflow: hidden; background: var(--sky); line-height: 0; }
    .map-stage img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
    @media (max-width: 639px) { .map-stage img { aspect-ratio: 800 / 1422; } }
    .hotspots { position: absolute; inset: 0; }
    .hot { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 3px solid var(--deep); background: var(--white); color: var(--deep); font-weight: 700; font-size: 15px; line-height: 1; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
    .hot.decision { border-color: var(--amber); }
    .hot:hover { background: var(--sky); }
    .hot.done { background: var(--teal); border-color: var(--white); color: var(--white); }
    .hot.now { background: var(--amber-fill); border-color: var(--white); color: var(--white); box-shadow: 0 0 0 4px rgba(185, 118, 28, .55), 0 2px 6px rgba(0, 0, 0, .35); }
    .map-stage.playing .hot { pointer-events: none; }
    @media (max-width: 639px) { .hot { width: 28px; height: 28px; font-size: 14px; border-width: 2px; } }
    @media (prefers-reduced-motion: no-preference) {
      .hot.now { animation: ping 1.6s ease-in-out infinite; }
      @keyframes ping { 0%, 100% { box-shadow: 0 0 0 4px rgba(185, 118, 28, .55), 0 2px 6px rgba(0, 0, 0, .35); } 50% { box-shadow: 0 0 0 10px rgba(185, 118, 28, .12), 0 2px 6px rgba(0, 0, 0, .35); } }
    }
    /* Gentle life on the water: glints that drift and twinkle, and a slow sweep of sunlight. Only over the sea (a mask picture),
       only after the mask has loaded, never when the visitor asks for less motion. */
    .sea-fx { display: none; position: absolute; inset: 0; overflow: hidden; pointer-events: none; mix-blend-mode: screen;
      -webkit-mask-image: url(assets/sea-mask-desktop.webp); mask-image: url(assets/sea-mask-desktop.webp);
      -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
    @media (max-width: 639px) { .sea-fx { -webkit-mask-image: url(assets/sea-mask-mobile.webp); mask-image: url(assets/sea-mask-mobile.webp); } }
    .map-stage.fx-ready .sea-fx { display: block; }
    .sea-fx i { position: absolute; display: block; will-change: transform, opacity; }
    .fx-a, .fx-b { top: -20px; bottom: -20px; left: 0; width: calc(100% + 400px); }
    .fx-a {
      background-image:
        radial-gradient(ellipse 7px 1.6px at 18% 22%, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0)),
        radial-gradient(ellipse 5px 1.4px at 62% 48%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0)),
        radial-gradient(ellipse 8px 1.8px at 38% 78%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0)),
        radial-gradient(ellipse 4px 1.2px at 84% 66%, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0));
      background-size: 160px 90px; opacity: .55;
      animation: fx-drift-a 22s linear infinite, fx-twinkle 3.6s ease-in-out infinite alternate;
    }
    .fx-b {
      background-image:
        radial-gradient(ellipse 6px 1.5px at 30% 35%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0)),
        radial-gradient(ellipse 9px 1.9px at 74% 20%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0)),
        radial-gradient(ellipse 5px 1.3px at 52% 82%, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0));
      background-size: 230px 130px; opacity: .45;
      animation: fx-drift-b 31s linear infinite, fx-twinkle 5.1s ease-in-out -2s infinite alternate;
    }
    .fx-sweep { top: 0; bottom: 0; left: -60%; width: 60%; opacity: .0;
      background: linear-gradient(105deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .22) 50%, rgba(255, 255, 255, 0) 70%);
      animation: fx-sweep 14s ease-in-out infinite;
    }
    @keyframes fx-drift-a { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-160px, 0, 0); } }
    @keyframes fx-drift-b { from { transform: translate3d(-230px, 0, 0); } to { transform: translate3d(0, 0, 0); } }
    @keyframes fx-twinkle { from { opacity: .25; } to { opacity: .85; } }
    @keyframes fx-sweep { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate3d(270%, 0, 0); opacity: 0; } }
    .map-stage.idle .sea-fx i { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) { .map-stage.fx-ready .sea-fx { display: none; } }
    /* Layers: a plate (clouds, far ship and the crane container taken out) with those pieces laid back where they were, then moved gently.
       Shown only after every picture has loaded; until then, and if any fails, the approved whole map is all there is. */
    .layer-fx { display: none; position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .map-stage.layers-ready .layer-fx { display: block; }
    .layer-fx img { position: absolute; display: block; max-width: none; }
    .map-stage:not(.map-settled) #map-img { opacity: 0; }
    .layer-fx .sprite { will-change: transform, opacity; }
    .layer-fx .cloud-a { animation: lx-cloud 90s ease-in-out infinite alternate; }
    .layer-fx .cloud-b { animation: lx-cloud 105s ease-in-out -35s infinite alternate; }
    .layer-fx .cloud-c { animation: lx-cloud 120s ease-in-out -70s infinite alternate; }
    .layer-fx .far-ship { animation: lx-ship 44s linear infinite; }
    .layer-fx .crane-container { animation: lx-sway 6s ease-in-out infinite alternate; }
    .layer-fx .truck-a { animation: lx-creep-a 5.5s ease-in-out infinite alternate; }
    .layer-fx .truck-b { animation: lx-creep-b 6.5s ease-in-out -2s infinite alternate; }
    @keyframes lx-cloud { from { transform: translate3d(-35%, 0, 0); } to { transform: translate3d(35%, 0, 0); } }
    @keyframes lx-ship { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 8% { opacity: 1; } 60% { opacity: 1; } 100% { transform: translate3d(95%, -52%, 0); opacity: 0; } }
    @keyframes lx-creep-a { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-1.6%, 0.5%, 0); } }
    @keyframes lx-creep-b { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(1.8%, -0.4%, 0); } }
    @keyframes lx-sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
    .map-stage.idle .layer-fx .sprite { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) { .layer-fx .sprite { animation: none; } }
    /* More life without touching the picture: a chimney that smokes, gulls that pass, cloud shadows that sweep the harbour, a sun that breathes.
       Drawn with gradients and a tiny vector; same safety switches as the water glints. */
    .sky-fx { display: none; position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .map-stage.fx-ready .sky-fx { display: block; }
    .sky-fx i, .sky-fx .gull { position: absolute; display: block; will-change: transform, opacity; }
    .sky-fx .sun { left: -8%; top: -14%; width: 34%; aspect-ratio: 1; border-radius: 50%; mix-blend-mode: screen;
      background: radial-gradient(circle, rgba(255, 244, 205, .55), rgba(255, 244, 205, 0) 65%); animation: fx-sun 9s ease-in-out infinite alternate; }
    .sky-fx .shade { top: 13.3%; bottom: 0; width: 34%; mix-blend-mode: multiply; opacity: .9;
      background: radial-gradient(ellipse at center, rgba(12, 46, 78, .17), rgba(12, 46, 78, 0) 68%); }
    .sky-fx .shade-a { left: -40%; animation: fx-shade 84s linear infinite; }
    .sky-fx .shade-b { left: -40%; width: 24%; animation: fx-shade 112s linear -46s infinite; }
    .sky-fx .smoke { left: 13.4%; top: 1.4%; width: 34px; aspect-ratio: 1; border-radius: 50%; opacity: 0;
      background: radial-gradient(circle, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 70%); animation: fx-smoke 9s ease-out infinite; }
    .sky-fx .smoke-b { animation-delay: -3s; }
    .sky-fx .smoke-c { animation-delay: -6s; }
    .sky-fx .gull { width: 22px; height: 9px; left: -4%; opacity: 0; }
    .sky-fx .gull path { fill: none; stroke: rgba(255, 255, 255, .95); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .sky-fx .gull .wing { transform-origin: 50% 80%; animation: fx-flap .9s ease-in-out infinite alternate; }
    .sky-fx .gull-a { top: 7%; animation: fx-gull 58s linear -8s infinite; }
    .sky-fx .gull-b { top: 10.5%; width: 17px; animation: fx-gull 71s linear -39s infinite; }
    .sky-fx .gull-c { top: 4.5%; width: 14px; animation: fx-gull 83s linear -61s infinite; }
    @media (max-width: 639px) {
      .sky-fx .shade { top: 11.6%; width: 52%; }
      .sky-fx .smoke { left: 22.3%; top: 7.9%; width: 26px; }
      .sky-fx .gull-a { top: 5%; } .sky-fx .gull-b { top: 8%; } .sky-fx .gull-c { top: 2.8%; }
    }
    @keyframes fx-sun { from { opacity: .35; transform: scale(1); } to { opacity: .85; transform: scale(1.07); } }
    @keyframes fx-shade { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(420%, 0, 0); } }
    @keyframes fx-smoke { 0% { transform: translate3d(0, 0, 0) scale(.5); opacity: 0; } 14% { opacity: .75; } 100% { transform: translate3d(54px, -28px, 0) scale(2.4); opacity: 0; } }
    @keyframes fx-gull { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 6% { opacity: 1; } 94% { opacity: 1; } 100% { transform: translate3d(2400%, -120%, 0); opacity: 0; } }
    @keyframes fx-flap { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
    .map-stage.idle .sky-fx i, .map-stage.idle .sky-fx .gull, .map-stage.idle .sky-fx .wing { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) { .map-stage.fx-ready .sky-fx { display: none; } }
    .preview { margin-top: 12px; padding: 14px 16px; border: 2px solid var(--teal); border-radius: 14px; background: var(--white); }
    .preview h3 { margin: 10px 0 0; font-size: 18px; line-height: 1.35; }
    .preview p { margin: 4px 0 0; color: var(--moss); }
    .avatar { overflow: hidden; }
    .avatar.has-img { background: var(--sky); }
    .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 6%; }
    .map-inner { position: relative; }
    @media (prefers-reduced-motion: no-preference) { .map-stage.playing .map-inner { transition: left .6s ease, top .6s ease; } }
    .card .avatar { display: none; }
    .figure { display: block; height: 300px; width: auto; max-width: 100%; margin: 10px auto 0; object-fit: contain; }
    @media (min-width: 720px) {
      .card { display: grid; grid-template-columns: minmax(0, 1fr) 240px; column-gap: 28px; }
      .card > * { grid-column: 1; }
      .card .figure { grid-column: 2; grid-row: 2 / span 7; width: 100%; height: auto; max-height: 460px; margin: 0; align-self: start; }
      .card .picks, .card .card-boundary { grid-column: 1 / -1; }
    }
    .scene .avatar { width: 64px; height: 64px; }
    .preview .avatar { width: 64px; height: 64px; }
    .cast .avatar { width: 56px; height: 56px; }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <a class="skip" id="skip" href="#main">跳至內容</a>
  <main class="page" id="main">
    <header class="top">
      <p class="eyebrow" id="eyebrow">作品館 · 教學玩具</p>
      <div class="lang" id="lang-group" role="group" aria-label="語言">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>
    <p class="boundary" id="boundary">教學示意 · 不含具體天數、費用或比例，一律以貨代或船公司通知為準。</p>
    <h1 id="title" tabindex="-1">貿易街</h1>
    <p class="intro" id="intro">一櫃貨明天要出海，整條街都在接力。</p>
    <p class="lede" id="lede">沿著港口走一趟，在六個關鍵時刻做決定，看趕不趕得上船。</p>
    <p class="hint" id="hint">同樣的選擇，永遠得到同一個結果。</p>
    <details class="primer" id="primer">
      <summary id="primer-title"></summary>
      <p id="primer-body"></p>
    </details>

    <section id="entry" aria-labelledby="entry-title">
      <h2 id="entry-title">先選這一週的情況</h2>
      <div class="scn" id="scn" role="radiogroup" aria-labelledby="entry-title"></div>
      <div class="actions">
        <button type="button" class="primary" id="start">出發</button>
        <a class="home" id="see-steps" href="../one-container-12-steps/">先看 12 步流程</a>
        <a class="home" id="see-cast" href="cast/">認識街上的人</a>
      </div>
      <div id="slot-entry">
        <div class="map-stage" id="map-stage">
          <div class="map-inner" id="map-inner">
            <picture>
              <source media="(max-width: 639px)" srcset="assets/layers/mobile-plate.webp" type="image/webp" />
              <img id="map-img" src="assets/layers/desktop-plate.webp" width="1600" height="900" alt="" />
            </picture>
            <div class="layer-fx" id="layer-fx" aria-hidden="true"></div>
            <div class="sea-fx" id="sea-fx" aria-hidden="true"><i class="fx-a"></i><i class="fx-b"></i><i class="fx-sweep"></i></div>
            <div class="sky-fx" id="sky-fx" aria-hidden="true">
              <i class="sun"></i>
              <i class="shade shade-a"></i><i class="shade shade-b"></i>
              <i class="smoke smoke-a"></i><i class="smoke smoke-b"></i><i class="smoke smoke-c"></i>
              <svg class="gull gull-a" viewBox="0 0 24 10" aria-hidden="true"><g class="wing"><path d="M1 8 Q6 0 12 6 Q18 0 23 8" /></g></svg>
              <svg class="gull gull-b" viewBox="0 0 24 10" aria-hidden="true"><g class="wing"><path d="M1 8 Q6 0 12 6 Q18 0 23 8" /></g></svg>
              <svg class="gull gull-c" viewBox="0 0 24 10" aria-hidden="true"><g class="wing"><path d="M1 8 Q6 0 12 6 Q18 0 23 8" /></g></svg>
            </div>
            <div class="hotspots" id="hotspots"></div>
          </div>
        </div>
      </div>
      <div class="preview" id="preview" hidden role="region" aria-labelledby="preview-title">
        <div class="speaker">
          <div class="avatar" id="preview-avatar" aria-hidden="true"></div>
          <div><b id="preview-name"></b><span id="preview-role"></span></div>
        </div>
        <p class="say" id="preview-say"></p>
        <h3 id="preview-title" tabindex="-1"></h3>
        <p id="preview-p"></p>
        <button type="button" class="text-btn" id="preview-close">關閉</button>
      </div>
      <ol class="route" id="route-entry" aria-label="十二站"></ol>
      <p class="hint" id="route-hint">橘色圓點是要做決定的站。</p>
    </section>

    <section id="play" hidden aria-labelledby="station-title">
      <div class="bar">
        <p class="progress" id="progress"></p>
        <div class="buffer" id="buffer" role="img"></div>
        <ul class="lights" id="lights" aria-label="四個時間點"></ul>
      </div>
      <div id="slot-play"></div>
      <div class="scene">
        <div class="speaker">
          <div class="avatar" id="avatar" aria-hidden="true"></div>
          <div><b id="speaker-name"></b><span id="speaker-role"></span></div>
        </div>
        <p class="say" id="say"></p>
        <h2 class="step-title" id="station-title" tabindex="-1"></h2>
        <p class="step-p" id="station-p"></p>
        <p class="scn-note" id="scn-note" hidden></p>
        <div class="brief" id="brief"></div>
        <p class="prompt" id="prompt" hidden></p>
        <div class="choices" id="choices" role="group" hidden></div>
        <div class="feedback" id="feedback" hidden role="status"></div>
        <div class="actions">
          <button type="button" class="primary" id="next"></button>
          <button type="button" class="text-btn" id="back" hidden></button>
        </div>
      </div>
    </section>

    <section id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title" tabindex="-1" class="sr">航程結果</h2>
      <div class="bar">
        <ul class="lights" id="result-lights" aria-label="四個時間點"></ul>
      </div>
      <article class="card" id="card" aria-labelledby="tier">
        <p class="card-kicker" id="card-kicker"></p>
        <img class="figure" id="card-figure" alt="" />
        <div class="speaker">
          <div class="avatar" id="card-avatar" aria-hidden="true"></div>
          <div><b id="card-name"></b><span id="card-role"></span></div>
        </div>
        <p class="style-line" id="style-line"></p>
        <h3 class="tier" id="tier"></h3>
        <p id="tier-line"></p>
        <p class="worst" id="worst"></p>
        <p class="worst" id="handover"></p>
        <ul class="picks" id="picks"></ul>
        <p class="card-boundary" id="card-boundary"></p>
      </article>
      <div class="actions">
        <button type="button" class="primary" id="download"></button>
        <button type="button" class="secondary" id="copy"></button>
        <button type="button" class="secondary" id="again"></button>
      </div>
      <p class="status" id="status" role="status"></p>
      <section class="takeaway" id="takeaway" aria-labelledby="takeaway-title">
        <h2 id="takeaway-title"></h2>
        <ul id="takeaway-list"></ul>
        <p><a class="home" id="takeaway-link" href="../one-container-12-steps/"></a></p>
      </section>
      <h2 id="cast-title" style="margin-top:28px"></h2>
      <ul class="cast" id="cast"></ul>
      <p><a class="home" id="cast-link" href="cast/">認識街上的人</a></p>
    </section>

    <p class="caveat" id="caveat"></p>
    <a class="home" id="home" href="/#showcase">回到作品館</a>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
