<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>你是哪一種隊友？ — Paul's Tradecraft</title>
  <meta name="description" content="三個小情境，看你怎麼做，就知道你是哪一種隊友。示意玩具，不是心理測驗。同樣的選擇，永遠得到同一張卡。" />
  <link rel="canonical" href="https://paulstradecraft.com/prototype/teammate-type/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Paul's Tradecraft" />
  <meta property="og:title" content="你是哪一種隊友？ · What kind of teammate are you?" />
  <meta property="og:description" content="示意玩具，不是心理測驗。三個小情境，同樣的選擇永遠得到同一張卡。" />
  <meta property="og:url" content="https://paulstradecraft.com/prototype/teammate-type/" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:locale:alternate" content="en_US" />
  <style>
    :root {
      --bone: #F6F3ED;
      --paper: #DDE7DE;
      --white: #ffffff;
      --ink: #193A35;
      --pine: #142C29;
      --moss: #62716A;
      --brass: #8A6A2B;
      --pop: #F08A6E;
      --line: #D4DAD1;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bone);
      color: var(--ink);
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", "WenQuanYi Micro Hei", "Droid Sans Fallback", ui-sans-serif, system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    button, a, input { font: inherit; }
    :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
    .skip {
      position: absolute;
      left: 12px;
      top: 12px;
      transform: translateY(-160%);
      background: var(--white);
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
    }
    .skip:focus { transform: none; }
    .page {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }
    .top, .actions, .lang { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .top { justify-content: space-between; }
    .eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .lang button, .text-btn, .choice, .primary {
      min-height: 44px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang button {
      min-width: 44px;
      padding: 6px 12px;
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--ink);
      font-weight: 700;
    }
    .lang button[aria-pressed="true"] { background: var(--pine); color: var(--bone); border-color: var(--pine); }
    .boundary {
      margin: 18px 0 0;
      padding: 8px 12px;
      border: 2px dashed rgba(25, 58, 53, 0.35);
      border-radius: 12px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
    }
    h1, h2, .duo-card h3 {
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    h1 { margin-top: 18px; max-width: 16em; font-size: clamp(1.75rem, 7vw, 2.75rem); }
    h1:focus, h2:focus { outline: none; }
    .lede, .hint, .stored, .same, .picks { margin: 14px 0 0; max-width: 40em; overflow-wrap: anywhere; }
    .hint, .stored, .same, .picks, .other-name, .role { color: var(--moss); }
    .progress { margin: 28px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .setting {
      display: inline-block;
      margin: 10px 0 0;
      padding: 4px 10px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--white);
      font-size: 13px;
      font-weight: 700;
    }
    #scenario-title { margin-top: 12px; font-size: clamp(1.35rem, 4.5vw, 1.85rem); }
    .prompt { margin: 10px 0 0; font-size: 1.05rem; overflow-wrap: anywhere; }
    .choices { display: grid; gap: 12px; margin-top: 18px; }
    .choice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      text-align: left;
      background: var(--white);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      border-radius: 1.25rem;
      box-shadow: 4px 4px 0 var(--ink);
      line-height: 1.45;
    }
    .choice:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--ink); }
    .letter {
      flex: none;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--pop);
      color: var(--pine);
      font-weight: 700;
    }
    .choice-text { min-width: 0; overflow-wrap: anywhere; }
    .text-btn {
      margin-top: 16px;
      padding: 8px 16px;
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--ink);
      font-weight: 700;
    }
    .text-btn:hover, .primary.ghost:hover { background: var(--paper); }
    #result { margin-top: 28px; }
    .card {
      min-width: 0;
      padding: 22px 18px 18px;
      background: var(--white);
      border: 2.5px solid var(--ink);
      border-radius: 1.25rem;
      box-shadow: 5px 5px 0 var(--ink);
    }
    .card-kicker { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .stage {
      position: relative;
      width: min(220px, 100%);
      height: 200px;
      margin: 8px auto 0;
    }
    .stage::before {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      top: 28px;
      bottom: 8px;
      border-radius: 50%;
      background: var(--paper);
    }
    .stage img {
      position: relative;
      z-index: 1;
      display: block;
      width: 150px;
      height: auto;
      margin: 18px auto 0;
      aspect-ratio: 192 / 208;
    }
    .prop { position: absolute; z-index: 2; width: 72px; height: 72px; }
    .prop-umbrella { left: 0; top: 6px; }
    .prop-drink { right: 0; bottom: 0; }
    .prop-spark { right: 0; top: 0; }
    .prop-map { left: 0; bottom: 0; }
    .prop-headphones { right: 0; top: 18px; }
    .prop-plan { left: 0; bottom: 8px; }
    .prop-note { right: 0; bottom: 8px; }
    .prop-crown { left: 50%; top: 0; margin-left: 28px; }
    .prop-palette { left: 0; top: 8px; }
    .stage .horse {
      position: relative;
      z-index: 1;
      display: block;
      width: min(236px, 100%);
      height: auto;
      margin: 0 auto;
      aspect-ratio: auto;
    }
    .stage.with-horse {
      width: min(276px, 100%);
      height: 214px;
    }
    .stage.with-horse #mg { display: none; }
    .stage.with-horse .prop-drink {
      width: 48px;
      height: 48px;
      right: 0;
      bottom: 0;
    }
    .stage .queen-art {
      position: relative;
      z-index: 1;
      display: block;
      width: auto;
      max-width: min(176px, 100%);
      max-height: 300px;
      height: auto;
      margin: 0 auto;
      aspect-ratio: auto;
    }
    .stage.with-queen {
      width: min(200px, 100%);
      height: 312px;
    }
    .stage.with-queen #mg { display: none; }
    .rare {
      display: inline-block;
      margin: 8px 0 0;
      padding: 2px 8px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--pop);
      color: var(--pine);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .companion { margin: 8px 0 0; font-size: 13px; font-weight: 700; text-align: center; }
    @keyframes mg-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes mg-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes mg-squash { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.06, 0.94); } }
    .motion-bob img { animation: mg-bob 240ms ease-in-out infinite; }
    .motion-float img, .motion-float .horse { animation: mg-float 1.4s ease-in-out infinite; }
    .motion-squash img { animation: mg-squash 320ms ease-in-out infinite; }
    #card-name { margin-top: 8px; font-size: clamp(1.6rem, 6vw, 2.15rem); }
    .other-name, .role, .line, .line-label, .line-body, .picks, .same, .card-boundary { margin: 0; overflow-wrap: anywhere; }
    .other-name { margin-top: 4px; font-weight: 700; }
    .role { margin-top: 6px; font-size: 14px; font-weight: 700; }
    .lines { display: grid; gap: 14px; margin-top: 18px; }
    .line-label { color: var(--brass); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .line-body { margin-top: 4px; }
    .line-funny .line-body { font-weight: 700; }
    .line-funny .mark {
      background-image: linear-gradient(transparent 58%, var(--pop) 58%, var(--pop) 92%, transparent 92%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .line-literary .line-body { font-family: "Songti TC", "PMingLiU", "Noto Serif CJK TC", Georgia, serif; font-size: 1.08rem; }
    .picks { margin-top: 18px; font-weight: 700; color: var(--ink); }
    .card-boundary {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 2px dashed rgba(25, 58, 53, 0.35);
      color: var(--moss);
      font-size: 13px;
      font-weight: 700;
    }
    .actions { margin-top: 16px; }
    .primary, .share-url {
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-weight: 700;
    }
    .primary { padding: 10px 16px; background: var(--pine); color: var(--bone); }
    .primary.ghost { background: var(--white); color: var(--ink); }
    .primary:hover { filter: brightness(1.12); }
    .primary.ghost:hover { filter: none; }
    .share-url {
      display: block;
      width: 100%;
      max-width: 100%;
      margin-top: 12px;
      min-height: 44px;
      padding: 8px 14px;
      background: var(--white);
      color: var(--ink);
    }
    .status { min-height: 1.4em; margin: 10px 0 0; font-weight: 700; }
    .duo { margin-top: 28px; }
    .duo h2 { font-size: clamp(1.35rem, 4.5vw, 1.85rem); }
    .duo-hint { margin: 8px 0 0; color: var(--moss); }
    .duo-form { display: grid; gap: 10px; margin-top: 14px; }
    .duo-form select, .duo-form input {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--white);
      color: var(--ink);
    }
    .duo-stage {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      margin-top: 16px;
      padding: 16px 12px 14px;
      border: 2px solid var(--ink);
      border-radius: 28px;
      background: linear-gradient(165deg, #f6f3ed, #e7eee8);
    }
    .duo-card { min-width: 0; }
    .duo-card h3 { font-size: clamp(1.35rem, 4.6vw, 1.75rem); }
    .duo-card .stage { width: min(200px, 100%); height: 168px; }
    .duo-card .stage img {
      width: auto;
      max-width: 100%;
      max-height: 148px;
      height: auto;
      margin: 10px auto 0;
      aspect-ratio: auto;
      object-fit: contain;
    }
    .duo-card .stage.with-queen { width: min(168px, 100%); height: 248px; }
    .duo-card .stage.with-queen img { max-height: 236px; }
    .duo-card .stage.with-horse { width: min(240px, 100%); height: 176px; }
    .duo-card .stage.with-horse img { width: min(228px, 100%); max-height: 168px; }
    .duo-card .stage img.face-in { transform: scaleX(-1); }
    .duo-card.rare-galaxy { border-color: #C4A15A; box-shadow: 0 0 0 4px #C4A15A, 5px 5px 0 var(--ink); }
    .duo-card.rare-andromeda { border-color: #D4B06A; box-shadow: 0 0 0 4px #D4B06A, 5px 5px 0 var(--ink); }
    .duo-card.rare-designer { border-color: #6E8B74; box-shadow: 0 0 0 4px #6E8B74, 5px 5px 0 var(--ink); }
    .duo-tag { margin: 8px 0 0; color: var(--brass); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .duo-bubbles {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }
    .duo-line {
      margin: 0;
      max-width: 100%;
      padding: 10px 12px;
      overflow-wrap: anywhere;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 18px;
      box-shadow: 3px 3px 0 rgba(25, 58, 53, 0.12);
    }
    .duo-line.from-left { align-self: flex-start; margin-right: 18px; border-bottom-left-radius: 5px; }
    .duo-line.from-right { align-self: flex-end; margin-left: 18px; border-bottom-right-radius: 5px; text-align: right; }
    .duo-speaker { display: block; color: var(--brass); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .duo-text { display: block; margin-top: 2px; }
    .duo-stage.theme-queens {
      border-color: #C4A15A;
      background-color: #1a102c;
      background-image:
        radial-gradient(1.4px 1.4px at 8% 14%, #fff6d8 50%, transparent 52%),
        radial-gradient(1.2px 1.2px at 18% 62%, rgba(255, 246, 216, 0.8) 50%, transparent 52%),
        radial-gradient(1.6px 1.6px at 32% 28%, #fff 50%, transparent 52%),
        radial-gradient(1px 1px at 44% 78%, rgba(255, 220, 160, 0.85) 50%, transparent 52%),
        radial-gradient(1.3px 1.3px at 57% 18%, #fff6d8 50%, transparent 52%),
        radial-gradient(1.1px 1.1px at 70% 46%, rgba(255, 255, 255, 0.75) 50%, transparent 52%),
        radial-gradient(1.5px 1.5px at 82% 22%, #ffe7a8 50%, transparent 52%),
        radial-gradient(1px 1px at 90% 68%, rgba(255, 246, 216, 0.7) 50%, transparent 52%),
        radial-gradient(1.2px 1.2px at 24% 88%, rgba(255, 255, 255, 0.65) 50%, transparent 52%),
        radial-gradient(1.4px 1.4px at 63% 90%, #ffe7a8 50%, transparent 52%),
        radial-gradient(ellipse at 50% -10%, rgba(212, 176, 106, 0.38), transparent 46%),
        radial-gradient(ellipse at 100% 100%, rgba(120, 80, 180, 0.45), transparent 42%),
        linear-gradient(165deg, #140e24 0%, #2a1744 46%, #1b1030 100%);
      box-shadow: 0 16px 40px rgba(28, 14, 48, 0.25);
    }
    .duo-stage.theme-queens .duo-line { border-color: #C4A15A; box-shadow: 3px 3px 0 rgba(196, 161, 90, 0.35); }
    .duo-stage.theme-queens #duo-boundary { color: #F6F3ED; border-top-color: rgba(246, 227, 176, 0.45); }
    .duo-stage.theme-royal {
      border-color: #C4A15A;
      background:
        radial-gradient(circle at 88% 0%, rgba(212, 176, 106, 0.42), transparent 42%),
        linear-gradient(160deg, #ebe3f6, #f6f3ed 62%);
    }
    .duo-stage.theme-alliance {
      background:
        radial-gradient(circle at 8% 100%, rgba(196, 176, 230, 0.55), transparent 46%),
        linear-gradient(160deg, #ece6f8, #f6f3ed 70%);
    }
    .duo-stage.theme-cocoa {
      background: linear-gradient(160deg, #f8e4dc, #f6f3ed 68%);
    }
    #duo-download { align-self: center; }
    @keyframes duo-enter-left {
      from { opacity: 0; transform: translate3d(-36px, 12px, 0); }
      to { opacity: 1; transform: none; }
    }
    @keyframes duo-enter-right {
      from { opacity: 0; transform: translate3d(36px, 12px, 0); }
      to { opacity: 1; transform: none; }
    }
    @keyframes duo-enter-bubble {
      from { opacity: 0; transform: translate3d(0, 14px, 0); }
      to { opacity: 1; transform: none; }
    }
    .duo-stage.is-open .duo-card-left { animation: duo-enter-left 700ms cubic-bezier(.16, .84, .32, 1) both; }
    .duo-stage.is-open .duo-card-right { animation: duo-enter-right 700ms cubic-bezier(.16, .84, .32, 1) 90ms both; }
    .duo-stage.is-open .duo-line { animation: duo-enter-bubble 520ms cubic-bezier(.16, .84, .32, 1) both; }
    .duo-stage.is-open .duo-line:nth-child(1) { animation-delay: 180ms; }
    .duo-stage.is-open .duo-line:nth-child(2) { animation-delay: 280ms; }
    .duo-stage.is-open .duo-line:nth-child(3) { animation-delay: 380ms; }
    .duo-stage.is-open .duo-line:nth-child(4) { animation-delay: 480ms; }
    @media (max-width: 859px) {
      .duo-stage { gap: 0; }
      .duo-bubbles { position: relative; z-index: 2; margin: 8px 0 0; }
      .duo-card-right { position: relative; z-index: 1; margin-top: -14px; }
    }
    @media (min-width: 860px) {
      .page.duo-open { width: min(1120px, calc(100% - 48px)); }
      .duo-stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(190px, 250px) minmax(0, 1fr);
        grid-template-areas:
          "left mid right"
          "foot foot foot"
          "save save save";
        align-items: stretch;
        gap: 18px 16px;
      }
      .duo-card-left { grid-area: left; }
      .duo-bubbles { grid-area: mid; align-self: center; }
      .duo-card-right { grid-area: right; margin-top: 0; }
      #duo-boundary { grid-area: foot; }
      #duo-download { grid-area: save; justify-self: center; }
    }
    .foot { margin-top: 36px; padding-top: 4px; }
    .back { display: inline-block; margin-top: 14px; color: var(--ink); font-weight: 700; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
      .choice:hover { transform: none; }
    }
    @media (max-width: 420px) {
      .page { width: calc(100% - 28px); }
      .choice { box-shadow: 3px 3px 0 var(--ink); }
    }
  </style>
</head>
<body>
  <a class="skip" id="skip" href="#main">跳至內容</a>
  <main class="page" id="main">
    <div class="top">
      <p class="eyebrow" id="eyebrow">Digital Garage · 輕科技玩具</p>
      <div class="lang" id="lang-group" role="group" aria-label="語言">
        <button type="button" data-set-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <p class="boundary" id="boundary">示意玩具，不是心理測驗。</p>
    <h1 id="title" tabindex="-1">你是哪一種隊友？</h1>
    <p class="lede" id="lede">不是問卷，是三個小情境。看你怎麼做，就知道你是哪一種隊友。</p>
    <p class="hint" id="hint">每個情境選一次。同樣的選擇，永遠得到同一張卡。</p>

    <section id="quiz" aria-labelledby="scenario-title">
      <p class="progress" id="progress"></p>
      <p class="setting" id="setting"></p>
      <h2 id="scenario-title" tabindex="-1"></h2>
      <p class="prompt" id="prompt"></p>
      <div class="choices" id="choices" role="group"></div>
      <button type="button" class="text-btn" id="back-step" hidden></button>
    </section>

    <section id="result" hidden>
      <article class="card" id="card" aria-labelledby="card-name">
        <p class="card-kicker" id="card-kicker"></p>
        <div class="stage" id="stage">
          <img id="mg" alt="" width="192" height="208" />
          <img id="horse" class="horse" alt="" hidden />
          <img id="queen-art" class="queen-art" alt="" hidden />
          <div id="prop"></div>
        </div>
        <h2 id="card-name" tabindex="-1"></h2>
        <p class="other-name" id="other-name"></p>
        <p class="role" id="role"></p>
        <p class="rare" id="rare" hidden></p>
        <p class="companion" id="companion" hidden></p>
        <div class="lines" id="lines"></div>
        <p class="picks" id="picks-label"></p>
        <p class="same" id="same"></p>
        <p class="card-boundary" id="card-boundary"></p>
      </article>
      <section class="duo" id="duo" aria-labelledby="duo-title">
        <h2 id="duo-title"></h2>
        <p class="duo-hint" id="duo-hint"></p>
        <div class="duo-form">
          <select id="duo-pick"></select>
          <input id="duo-code" type="text" autocomplete="off" spellcheck="false" />
          <button type="button" class="primary" id="duo-open"></button>
        </div>
        <p class="status" id="duo-status" role="status"></p>
        <div class="duo-stage" id="duo-stage" hidden>
          <article class="card duo-card duo-card-left" id="duo-card-left">
            <p class="card-kicker" id="duo-left-kicker"></p>
            <div class="stage" id="duo-left-stage">
              <img id="duo-left" alt="" />
            </div>
            <h3 id="duo-left-name" tabindex="-1"></h3>
            <p class="other-name" id="duo-left-other"></p>
            <p class="role" id="duo-left-role"></p>
            <p class="rare" id="duo-left-rare" hidden></p>
            <p class="duo-tag" id="duo-left-tag"></p>
            <div class="lines" id="duo-left-lines"></div>
            <p class="picks" id="duo-left-picks"></p>
          </article>
          <div class="duo-bubbles" id="duo-lines"></div>
          <article class="card duo-card duo-card-right" id="duo-card-right">
            <p class="card-kicker" id="duo-right-kicker"></p>
            <div class="stage" id="duo-right-stage">
              <img id="duo-right" alt="" />
            </div>
            <h3 id="duo-right-name" tabindex="-1"></h3>
            <p class="other-name" id="duo-right-other"></p>
            <p class="role" id="duo-right-role"></p>
            <p class="rare" id="duo-right-rare" hidden></p>
            <p class="duo-tag" id="duo-right-tag"></p>
            <div class="lines" id="duo-right-lines"></div>
            <p class="picks" id="duo-right-picks"></p>
          </article>
          <p class="card-boundary" id="duo-boundary"></p>
          <button type="button" class="primary ghost" id="duo-download"></button>
        </div>
      </section>
      <div class="actions">
        <button type="button" class="primary" id="copy-link"></button>
        <button type="button" class="primary ghost" id="share-btn"></button>
        <button type="button" class="primary ghost" id="download"></button>
        <button type="button" class="primary ghost" id="again"></button>
      </div>
      <label class="sr" for="share-url" id="share-label" style="position:absolute;left:-9999px">Link</label>
      <input class="share-url" id="share-url" type="text" readonly />
      <p class="status" id="status" role="status"></p>
    </section>

    <footer class="foot">
      <p class="boundary" id="foot-boundary">示意玩具，不是心理測驗。</p>
      <p class="stored" id="stored">不儲存任何資料。分享連結帶三個選擇；加了另一張卡時，也會帶上。</p>
      <a class="back" id="back" href="/?lang=zh#garage">回到 Digital Garage</a>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
