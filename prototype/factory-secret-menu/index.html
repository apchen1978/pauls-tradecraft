<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Factory Secret Menu — a demo commercial garage experiment." />
  <title>Factory Secret Menu — Garage Prototype</title>
  <style>
    :root {
      --paper: #f7f5ee;
      --bone: #efe9db;
      --ink: #18251f;
      --forest: #193A35;
      --moss: #62716A;
      --amber: #8A6A2B;
      --line: #d9d3c3;
      --quiet: #fdfbf5;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .shell { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 72px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
    .mark, .status, .eyebrow { font-size: 10px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    .mark { color: var(--forest); }
    .status { color: var(--moss); text-align: right; }
    header { padding: clamp(54px, 10vw, 116px) 0 clamp(42px, 7vw, 78px); max-width: 820px; }
    .eyebrow { color: var(--amber); margin: 0 0 16px; }
    h1 { margin: 0; font: 600 clamp(45px, 8vw, 88px)/.95 Georgia, "Noto Serif TC", serif; letter-spacing: -.055em; color: var(--forest); }
    .lede { max-width: 600px; margin: 24px 0 0; font: 400 clamp(18px, 2.2vw, 25px)/1.45 Georgia, "Noto Serif TC", serif; color: #31463b; }
    .boundary { margin: 28px 0 0; max-width: 635px; color: var(--moss); font-size: 13px; line-height: 1.65; }
    .boundary b { color: var(--forest); }
    .menu { display: grid; grid-template-columns: minmax(240px, .78fr) minmax(0, 1.4fr); border-top: 1px solid var(--forest); border-bottom: 1px solid var(--forest); }
    .menu-nav { padding: 26px 26px 30px 0; border-right: 1px solid var(--line); }
    .menu-nav h2 { margin: 0 0 20px; font-size: 13px; font-weight: 700; letter-spacing: .01em; color: var(--forest); }
    .menu-nav p { margin: 0 0 21px; color: var(--moss); font-size: 13px; line-height: 1.55; }
    .choice { width: 100%; display: flex; align-items: baseline; gap: 12px; padding: 13px 0; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
    .choice:last-child { border-bottom: 1px solid var(--line); }
    .choice .num { color: var(--amber); font: 700 11px/1 ui-monospace, monospace; }
    .choice .name { font: 600 16px/1.2 Georgia, "Noto Serif TC", serif; }
    .choice:hover .name, .choice[aria-pressed="true"] .name { color: var(--forest); }
    .choice[aria-pressed="true"] .name::after { content: " ↗"; color: var(--amber); }
    .pressure-label { margin: 27px 0 10px; color: var(--moss); font-size: 10px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .pressures { display: flex; flex-wrap: wrap; gap: 7px; }
    .pressure { border: 1px solid var(--line); border-radius: 999px; padding: 8px 10px; background: transparent; color: var(--ink); font-size: 12px; cursor: pointer; }
    .pressure:hover, .pressure[aria-pressed="true"] { border-color: var(--amber); color: var(--forest); background: rgba(138,106,43, .08); }
    .recombine { margin-top: 20px; width: 100%; border: 1px solid var(--forest); padding: 11px 13px; background: var(--forest); color: var(--bone); font-weight: 750; font-size: 12px; cursor: pointer; }
    .recombine:hover { background: #1a3b2c; }
    .panel { min-height: 480px; padding: clamp(26px, 4vw, 54px); background: var(--quiet); display: flex; flex-direction: column; }
    .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .kind { color: var(--amber); font-size: 10px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
    .state { color: var(--moss); font-size: 11px; }
    .verb { margin: clamp(35px, 6vw, 70px) 0 0; max-width: 690px; font: 600 clamp(30px, 5vw, 55px)/1.02 Georgia, "Noto Serif TC", serif; letter-spacing: -.035em; color: var(--forest); }
    .turn { margin: 22px 0 0; max-width: 580px; font-size: 16px; line-height: 1.65; color: #35473c; }
    .artifact { margin-top: auto; padding-top: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .artifact > div { min-height: 112px; padding: 17px; border: 1px solid var(--line); }
    .artifact .label { margin: 0 0 9px; color: var(--moss); font-size: 10px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .artifact p { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.45; }
    .artifact .surprise { background: var(--forest); border-color: var(--forest); }
    .artifact .surprise .label { color: #d8b467; }
    .artifact .surprise p { color: var(--bone); font: 600 17px/1.25 Georgia, "Noto Serif TC", serif; }
    .recipe { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line); opacity: .42; transition: opacity .18s ease; }
    .recipe.ready { opacity: 1; }
    .recipe-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .recipe-title { margin: 0; color: var(--forest); font: 600 19px/1.2 Georgia, "Noto Serif TC", serif; }
    .recipe-status { color: var(--moss); font-size: 11px; }
    .recipe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 13px; }
    .recipe-grid > div { padding: 12px; border-left: 2px solid var(--amber); background: rgba(239, 233, 219, .52); }
    .recipe-grid .recipe-label { margin: 0 0 6px; color: var(--moss); font-size: 9px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .recipe-grid p:last-child { margin: 0; font-size: 12px; line-height: 1.45; }
    .question { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 24px 0; border-bottom: 1px solid var(--line); }
    .question h2 { margin: 0; max-width: 680px; font: 500 clamp(20px, 3vw, 30px)/1.22 Georgia, "Noto Serif TC", serif; color: var(--forest); }
    .question p { margin: 7px 0 0; color: var(--moss); font-size: 13px; line-height: 1.55; }
    .reveal { border: 1px solid var(--forest); border-radius: 999px; padding: 11px 16px; background: transparent; color: var(--forest); font-weight: 750; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .reveal:hover, .reveal[aria-expanded="true"] { background: var(--forest); color: var(--bone); }
    .truth { display: none; padding: 0 0 30px; color: var(--ink); font-size: 14px; line-height: 1.7; }
    .truth.visible { display: block; }
    .truth b { color: var(--forest); }
    footer { display: flex; justify-content: space-between; gap: 20px; padding-top: 26px; color: var(--moss); font-size: 12px; line-height: 1.55; }
    footer p { max-width: 520px; margin: 0; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 32px, 1160px); }
      .menu { grid-template-columns: 1fr; }
      .menu-nav { padding: 24px 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .panel { min-height: 500px; padding: 28px 0; background: transparent; }
      .artifact { grid-template-columns: 1fr; }
      .recipe-grid { grid-template-columns: 1fr; }
      .question { grid-template-columns: 1fr; }
      .reveal { justify-self: start; }
      footer { display: block; }
      footer p + p { margin-top: 12px; }
    }
    @media (prefers-reduced-motion: no-preference) { .panel { transition: opacity .18s ease; } }
    .top-right { display: flex; align-items: center; gap: 14px; }
    .language-toggle { display: inline-flex; gap: 4px; }
    .language-toggle button { border: 1px solid var(--line); background: transparent; color: var(--moss); padding: 5px 9px; font-size: 11px; font-weight: 750; letter-spacing: .06em; cursor: pointer; }
    .language-toggle button[aria-pressed="true"] { border-color: var(--forest); background: #e7eee5; color: var(--ink); }
    @media (max-width: 700px) { .topline { flex-wrap: wrap; } .status { text-align: left; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline">
      <span class="mark" id="mark"></span>
      <span class="top-right">
        <span class="status" id="status"></span>
        <span class="language-toggle" role="group" aria-label="Language"><button id="langZh" type="button" aria-pressed="true">繁中</button><button id="langEn" type="button" aria-pressed="false">EN</button></span>
      </span>
    </div>

    <header>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
      <p class="boundary" id="boundary"></p>
    </header>

    <section class="menu" id="menu">
      <nav class="menu-nav" id="menuNav">
        <h2 id="navTitle"></h2>
        <p id="navNote"></p>
        <button class="choice" type="button" data-key="material" aria-pressed="true"><span class="num">01</span><span class="name" id="choiceMaterial"></span></button>
        <button class="choice" type="button" data-key="smallrun" aria-pressed="false"><span class="num">02</span><span class="name" id="choiceSmallrun"></span></button>
        <button class="choice" type="button" data-key="test" aria-pressed="false"><span class="num">03</span><span class="name" id="choiceTest"></span></button>
        <p class="pressure-label" id="pressureLabel"></p>
        <div class="pressures" id="pressures">
          <button class="pressure" type="button" data-pressure="risk" aria-pressed="true"></button>
          <button class="pressure" type="button" data-pressure="speed" aria-pressed="false"></button>
          <button class="pressure" type="button" data-pressure="proof" aria-pressed="false"></button>
        </div>
        <button class="recombine" id="recombine" type="button"></button>
      </nav>

      <article class="panel" id="panel" aria-live="polite">
        <div class="panel-top"><span class="kind" id="kind"></span><span class="state" id="state"></span></div>
        <h2 class="verb" id="verb"></h2>
        <p class="turn" id="turn"></p>
        <div class="artifact">
          <div><p class="label" id="momentLabel"></p><p id="moment"></p></div>
          <div class="surprise"><p class="label" id="moveLabel"></p><p id="move"></p></div>
        </div>
        <div class="recipe" id="recipe">
          <div class="recipe-head"><p class="recipe-title" id="recipeTitle"></p><span class="recipe-status" id="recipeStatus"></span></div>
          <div class="recipe-grid">
            <div><p class="recipe-label" id="inputLabel"></p><p id="recipeInput"></p></div>
            <div><p class="recipe-label" id="unknownLabel"></p><p id="recipeUnknown"></p></div>
            <div><p class="recipe-label" id="decisionLabel"></p><p id="recipeDecision"></p></div>
          </div>
        </div>
      </article>
    </section>

    <section class="question" aria-labelledby="question-title">
      <div>
        <h2 id="question-title"></h2>
        <p id="questionNote"></p>
      </div>
      <button class="reveal" id="reveal" type="button" aria-expanded="false" aria-controls="truth"></button>
    </section>
    <div class="truth" id="truth"></div>

    <footer>
      <p id="footerA"></p>
      <p id="footerB"></p>
    </footer>
  </main>

  <script>

      set("choiceMaterial", c.ideas.material.choice); set("choiceSmallrun", c.ideas.smallrun.choice); set("choiceTest", c.ideas.test.choice);
      set("pressureLabel", c.pressureLabel); set("recombine", c.recombine); set("state", c.state);
      set("momentLabel", c.momentLabel); set("moveLabel", c.moveLabel);
      set("inputLabel", c.inputLabel); set("unknownLabel", c.unknownLabel); set("decisionLabel", c.decisionLabel);
      document.querySelectorAll(".pressure").forEach((button) => { button.textContent = c.pressures[button.dataset.pressure].label; });
      set("question-title", c.questionTitle); set("questionNote", c.questionNote);
      html("truth", c.truth); set("footerA", c.footerA); set("footerB", c.footerB);
      const open = $("reveal").getAttribute("aria-expanded") === "true";
      set("reveal", open ? c.revealOpen : c.reveal);
      $("langZh").setAttribute("aria-pressed", String(lang === "zh"));
      $("langEn").setAttribute("aria-pressed", String(lang === "en"));
    }

    function show(key) {
      selectedKey = key;
      const idea = copy[lang].ideas[key];
      set("kind", idea.kind); set("verb", idea.verb); set("turn", idea.turn); set("moment", idea.moment); set("move", idea.move);
      document.querySelectorAll(".choice").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.key === key)));
      renderRecipe(recipeReady);
    }
    function choosePressure(key) {
      selectedPressure = key;
      document.querySelectorAll(".pressure").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.pressure === key)));
      renderRecipe(false);
    }
    function renderRecipe(ready) {
      recipeReady = ready;
      const c = copy[lang];
      const pressure = c.pressures[selectedPressure];
      const idea = c.ideas[selectedKey];
      set("recipeTitle", ready ? c.recipeReady : c.recipeDraft);
      set("recipeStatus", ready ? c.statusReady : c.statusDraft);
      set("recipeInput", `${idea.short} + ${pressure.label} → ${pressure.transform}`);
      set("recipeUnknown", pressure.unknown);
      set("recipeDecision", pressure.decision);
      $("recipe").classList.toggle("ready", ready);
    }
    function setLanguage(value) {
      lang = value === "en" ? "en" : "zh";
      applyStatic();
      show(selectedKey);
      const url = new URL(location.href);
      url.searchParams.set("lang", lang);
      history.replaceState(null, "", url);
    }

    document.querySelectorAll(".choice").forEach((button) => button.addEventListener("click", () => { recipeReady = false; show(button.dataset.key); }));
    document.querySelectorAll(".pressure").forEach((button) => button.addEventListener("click", () => choosePressure(button.dataset.pressure)));
    $("recombine").addEventListener("click", () => renderRecipe(true));
    $("langZh").addEventListener("click", () => setLanguage("zh"));
    $("langEn").addEventListener("click", () => setLanguage("en"));
    $("reveal").addEventListener("click", () => {
      const isOpen = $("reveal").getAttribute("aria-expanded") === "true";
      $("reveal").setAttribute("aria-expanded", String(!isOpen));
      set("reveal", isOpen ? copy[lang].reveal : copy[lang].revealOpen);
      $("truth").classList.toggle("visible", !isOpen);
    });
    applyStatic();
    show("material");
  </script>
</body>
</html>
