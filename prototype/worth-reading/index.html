    .back { display: inline-block; margin-top: 14px; }
    @media (prefers-reduced-motion: reduce) {

    var params = new URLSearchParams(location.search);

    function el(tag, cls, text) {
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    function fillRich(node, segments) {
      segments.forEach(function (seg) {
        if (seg.mark) node.appendChild(el("span", seg.mark, seg.t));
        else node.appendChild(document.createTextNode(seg.t));
      });
    }

    function renderLetters(c) {
      var root = document.getElementById("letters");
      root.replaceChildren();
      c.letters.forEach(function (letter) {
        var card = el("article", "letter" + (choice === letter.id ? " is-on" : ""));
        card.id = "letter-" + letter.id;
        var top = el("div", "letter-top");
        top.appendChild(el("p", "stamp", letter.name));
        if (choice === letter.id) top.appendChild(el("p", "yours", c.yours));
        card.appendChild(top);
        var subject = el("p", "subject");
        subject.appendChild(el("span", "k", c.subject));
        subject.appendChild(el("span", letter.subjectMark, letter.subject));
        card.appendChild(subject);
        letter.blocks.forEach(function (segments) {
          var p = el("p");
          fillRich(p, segments);
          card.appendChild(p);
        });
        var button = el("button", "pick", choice === letter.id ? c.picked : c.pick);
        button.type = "button";
        button.setAttribute("aria-pressed", choice === letter.id ? "true" : "false");
        button.addEventListener("click", function () { choose(letter.id); });
        card.appendChild(button);
        root.appendChild(card);
      });
    }

    function renderReveal(c, focus) {
      var box = document.getElementById("reveal");
      if (!choice) {
        box.hidden = true;
        box.replaceChildren();
        document.body.classList.remove("is-open");
        return;
      }
      document.body.classList.add("is-open");
      box.hidden = false;
      box.replaceChildren();
      box.appendChild(el("p", "stamp", c.reading));
      var h = el("h2", null, c.aTitle);
      h.id = "reveal-heading";
      h.tabIndex = -1;
      box.appendChild(h);
      box.appendChild(el("p", "verdict", choice === "a" ? c.verdictA : c.verdictB));
      box.appendChild(el("p", "legend", c.legend));
      var grid = el("div", "reasons");
      var a = el("div", "reason");
      a.appendChild(el("h3", null, c.aLead));
      var aList = el("ul");
      c.aReasons.forEach(function (reason) { aList.appendChild(el("li", null, reason)); });

      b.appendChild(el("h3", null, c.bTitle));
      var bList = el("ol");
      c.bReasons.forEach(function (reason) { bList.appendChild(el("li", null, reason)); });

      grid.appendChild(a);

      box.appendChild(grid);

      box.appendChild(el("p", "disclaimer", c.disclaimer));

      again.type = "button";
      again.addEventListener("click", function () {

        if (title) title.focus();

        button.setAttribute("aria-pressed", button.dataset.lang === lang ? "true" : "false");
      });
      renderLetters(c);
      renderReveal(c, focusReveal);
    }

    function choose(id) {
      choice = id;
      render(true);
    }

    document.querySelectorAll(".lang button").forEach(function (button) {
      button.addEventListener("click", function () {
        lang = button.dataset.lang === "en" ? "en" : "zh";
        try {
          var url = new URL(location.href);
          url.searchParams.set("lang", lang);
          history.replaceState(null, "", url);
        } catch (err) {}
        render(false);
      });
    });

    render(false);
  })();
  </script>
</body>
</html>
