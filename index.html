<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="從產品到買家這一段，我陪你一起打通。Paul Chen：15 年國際業務，含中國大陸通路與團隊管理，把找買家、算利潤、談成訂單的判斷做成能試玩的工具。" />
    <title>Paul's Tradecraft｜好產品，值得遇到對的買家</title>

    <!-- Security: static hosting cannot set response headers, so the policy is delivered by meta. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Hero art and the Chinese snapshot, discovered at parse time.
         Phones get the 800px WebP; wider screens get the full file.
         Noto's 213 unicode-range slices are not loaded: they are render-blocking
         and were starving these images on a slow link. CJK uses the system font. -->
    <link rel="preload" as="image" href="/images/paul-art-800.webp" type="image/webp" fetchpriority="high" media="(max-width: 768px)" />
    <link rel="preload" as="image" href="/images/paul-art.webp" type="image/webp" fetchpriority="high" media="(min-width: 769px)" />
    <link rel="preload" as="image" href="/images/cdd-executive-snapshot-zh-v02-800.webp" type="image/webp" fetchpriority="high" media="(max-width: 768px)" />
    <link rel="preload" as="image" href="/images/cdd-executive-snapshot-zh-v02.png" type="image/png" fetchpriority="high" media="(min-width: 769px)" />

    <!-- Canonical -->
    <link rel="canonical" href="https://paulstradecraft.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paul's Tradecraft" />
    <meta property="og:title" content="Paul's Tradecraft｜好產品，值得遇到對的買家" />
    <meta property="og:description" content="從產品到買家這一段，我陪你一起打通。Paul Chen：15 年國際業務，含中國大陸通路與團隊管理，把找買家、算利潤、談成訂單的判斷做成能試玩的工具。" />
    <meta property="og:url" content="https://paulstradecraft.com/" />
    <meta property="og:image" content="https://paulstradecraft.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paul's Tradecraft｜好產品，值得遇到對的買家" />
    <meta name="twitter:description" content="從產品到買家這一段，我陪你一起打通。Paul Chen：15 年國際業務，含中國大陸通路與團隊管理，把找買家、算利潤、談成訂單的判斷做成能試玩的工具。" />
    <meta name="twitter:image" content="https://paulstradecraft.com/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://paulstradecraft.com/#website",
            "name": "Paul's Tradecraft",
            "url": "https://paulstradecraft.com/",
            "description": "From product to buyer, I'll clear the path with you. Paul Chen: 15 years in international sales, including mainland China channels and team management, turning the judgment calls of finding buyers, working out profit and closing orders into tools you can try."
          },
          {
            "@type": "Person",
            "@id": "https://paulstradecraft.com/#paul-chen",
            "name": "Paul Chen",
            "jobTitle": "Overseas commercial decision support",
            "description": "From product to buyer, I'll clear the path with you. Paul Chen: 15 years in international sales, including mainland China channels and team management, turning the judgment calls of finding buyers, working out profit and closing orders into tools you can try.",
            "email": "mailto:paulchen1978@gmail.com",
            "url": "https://paulstradecraft.com/",
            "image": "https://paulstradecraft.com/og-image.png",
            "sameAs": ["https://github.com/apchen1978"],
            "knowsAbout": ["Overseas Buyer Qualification", "Order Commitment", "Trade Profitability", "Commercial Decision Support", "International Trade", "Payment Commitment Control", "Supply Chain Management", "Business Workflow Design"],
            "address": { "@type": "PostalAddress", "addressCountry": "TW" },
            "knowsLanguage": ["zh-Hant", "en"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Hero artwork for phones, painted from the HTML before any script runs.
         It lives OUTSIDE #root on purpose: React never removes or re-creates it, so the browser
         keeps this one image as the page's largest paint instead of swapping it for a later copy.
         Same place and size the hero used (below the 68px nav + 1px border, 14rem tall); the
         React hero draws its own artwork only from md up, and leaves this band transparent.
         The <source> keeps wide screens on the large file the React hero loads anyway. -->
    <div id="hero-art" aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-[69px] z-0 h-[14rem] overflow-hidden bg-pine md:hidden">
      <picture>
        <source media="(min-width: 769px)" srcset="/images/paul-art.webp" type="image/webp" />
        <img
          src="/images/paul-art-800.webp"
          alt=""
          width="1229"
          height="1536"
          class="absolute inset-x-0 top-0 h-[14rem] w-full object-cover object-[55%_18%] opacity-90"
          fetchpriority="high"
          decoding="sync"
        />
      </picture>
      <div class="absolute inset-x-0 top-0 h-[14rem] bg-[linear-gradient(180deg,rgba(20,44,41,0.2)_0%,rgba(20,44,41,0)_30%,rgba(20,44,41,1)_82%)]"></div>
    </div>
    <div id="root">
      <!-- Placeholder shown until React mounts, then replaced: the nav band and the dark hero area,
           so the page is not a light screen with a lone picture. No text, no buttons. -->
      <div class="md:hidden" aria-hidden="true">
        <header class="sticky top-0 z-50 border-b border-bone/15 bg-pine/95"><div class="mx-auto h-[68px] max-w-7xl"></div></header>
        <section class="border-b border-bone/15 bg-[linear-gradient(to_bottom,transparent_14rem,var(--color-pine)_14rem)]"><div class="min-h-[calc(100svh-68px)]"></div></section>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
