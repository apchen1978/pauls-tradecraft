  <rect x="80" y="758" width="1440" height="1" fill="#c9c2b5"/>
  <text x="80" y="811" fill="#687168" font-family="Arial, sans-serif" font-size="16">供應商現實  →  老闆目標  →  證據  →  人的判斷</text>
