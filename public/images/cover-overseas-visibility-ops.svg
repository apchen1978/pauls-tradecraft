<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="海外可見度作業封面：正在成形的貿易工作平台。露出可以一直在，找得到人，承諾留給人。">
  <rect width="1600" height="900" fill="#f5f1e8"/>
  <rect x="78" y="64" width="1444" height="1" fill="#c9c2b5"/>
  <text x="80" y="113" fill="#214c3d" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4">OVERSEAS VISIBILITY OPS</text>
  <text x="80" y="174" fill="#a6543d" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">成形中 · 尚未市場驗證</text>
  <text x="80" y="310" fill="#182019" font-family="Georgia, serif" font-size="64">露出可以一直在。</text>
  <text x="80" y="400" fill="#182019" font-family="Georgia, serif" font-size="64">找得到該找的人。</text>
  <text x="80" y="494" fill="#214c3d" font-family="Georgia, serif" font-size="48" font-style="italic">承諾仍留給人。</text>
  <text x="83" y="566" fill="#5b665d" font-family="Arial, sans-serif" font-size="24">不必只靠買位子 · 不寫金額 · 不保證訂單</text>
  <g transform="translate(980 210)">
    <rect width="460" height="430" fill="#12362b"/>
    <text x="36" y="52" fill="#e5c988" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">IN FORMATION</text>
    <text x="36" y="118" fill="#fff" font-family="Georgia, serif" font-size="28">找得到客戶</text>
    <text x="36" y="168" fill="#fff" font-family="Georgia, serif" font-size="28">找得到人</text>
    <text x="36" y="218" fill="#fff" font-family="Georgia, serif" font-size="28">露出一直在</text>
    <line x1="36" x2="424" y1="258" y2="258" stroke="#7c987f"/>
    <text x="36" y="310" fill="#e5c988" font-family="Arial, sans-serif" font-size="16">人留下</text>
    <text x="36" y="352" fill="#fff" font-family="Georgia, serif" font-size="24">資格 · 報價 · 付款</text>
    <text x="36" y="400" fill="#c8d4c8" font-family="Arial, sans-serif" font-size="15">上游於商務決策工作台</text>
  </g>
  <rect x="80" y="758" width="1440" height="1" fill="#c9c2b5"/>
  <text x="80" y="811" fill="#687168" font-family="Arial, sans-serif" font-size="16">買位子再等  →  一直在並且找得到人  →  人做承諾  →  訂單仍是未知</text>
</svg>
