<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">窗簾銷售 Pilot 案例簡報</title>
  <desc id="desc">一份以證據整理銷售 Pilot 流程與下一步的合成案例簡報封面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b25"/>
      <stop offset="0.58" stop-color="#173d32"/>
      <stop offset="1" stop-color="#0b1d1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9a441" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#f4f1e8" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1320" cy="-60" r="420" fill="#d9a441" opacity=".09"/>
  <circle cx="1450" cy="820" r="290" fill="#74a78b" opacity=".08"/>
  <path d="M0 760C260 610 410 820 710 650S1190 460 1600 590" fill="none" stroke="url(#glow)" stroke-width="2"/>
  <rect x="92" y="88" width="1416" height="724" rx="24" fill="#0b201b" fill-opacity=".34" stroke="#efe8d7" stroke-opacity=".18"/>
  <rect x="136" y="136" width="228" height="34" rx="17" fill="#d9a441" fill-opacity=".16" stroke="#e2b85d" stroke-opacity=".7"/>
  <text x="250" y="159" fill="#f0c96f" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">DEMO / SYNTHETIC CASE</text>
  <text x="136" y="300" fill="#f7f3e8" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="78" font-weight="700" letter-spacing="-2">窗簾銷售 Pilot</text>
  <text x="136" y="382" fill="#f7f3e8" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="78" font-weight="700" letter-spacing="-2">追蹤器</text>
  <rect x="140" y="430" width="96" height="3" fill="#d9a441"/>
  <text x="136" y="486" fill="#d9e4d8" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="27" font-weight="500">把 Pilot 流程與結果，整理成可交接的商業證據</text>
  <text x="136" y="545" fill="#aebfb1" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="19" letter-spacing="2">SALES ENABLEMENT  ·  EVIDENCE BRIEF  ·  HUMAN REVIEW</text>
  <g transform="translate(1040 220)">
    <rect width="360" height="350" rx="14" fill="#f5f3eb" fill-opacity=".97"/>
    <rect width="360" height="44" rx="14" fill="#e9e7de"/>
    <circle cx="24" cy="22" r="6" fill="#d9a441"/><circle cx="44" cy="22" r="6" fill="#93aa9a"/><circle cx="64" cy="22" r="6" fill="#173d32"/>
    <text x="30" y="91" fill="#173d32" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="15" font-weight="700">PILOT EVIDENCE BRIEF</text>
    <rect x="30" y="116" width="300" height="10" rx="5" fill="#cbd8cc"/><rect x="30" y="143" width="220" height="10" rx="5" fill="#d9a441" fill-opacity=".7"/>
    <text x="30" y="196" fill="#173d32" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="14" font-weight="700">流程狀態</text>
    <rect x="30" y="216" width="300" height="1" fill="#ccd5cd"/>
    <circle cx="44" cy="254" r="9" fill="#2f6b4f"/><path d="m40 254 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="68" y="260" fill="#52665a" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="14">資料整理與審核</text>
    <circle cx="44" cy="296" r="9" fill="#d9a441"/><text x="68" y="302" fill="#52665a" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="14">下一步待確認</text>
    <rect x="30" y="326" width="160" height="8" rx="4" fill="#cbd8cc"/>
  </g>
  <text x="136" y="742" fill="#f0c96f" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="16" font-weight="700" letter-spacing="3">PAUL'S TRADECRAFT  /  CASE BRIEF</text>
  <text x="136" y="774" fill="#aebfb1" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="16">公開展示 · 不代表商業採用或成效保證</text>
</svg>
