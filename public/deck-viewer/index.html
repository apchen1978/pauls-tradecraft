  <body>
    <header class="bar">
      <a class="back" href="/">← Paul's Tradecraft</a>
      <h1 class="title">把事情講到可以決定 <span class="sub">A shared decision surface</span></h1>
      <a class="dl" href="executive-capability-deck.pdf" download>下載 PDF</a>
    </header>

    <section class="intro" aria-label="作品定位">
      <p class="kicker">不是把文字放進投影片</p>
      <p class="intro-copy">這份 deck 示範一個更實際的轉換：把散落的資訊、分歧與未知，整理成一群人可以共同挑戰、共同判斷的下一個畫面。</p>
      <div class="signals" aria-label="閱讀提示">
        <span>看清楚：事實／推論／未知</span>
        <span>看見：選項與取捨</span>
        <span>留下：下一個人類決定</span>
      </div>
    </section>

    <main class="stage" id="stage" aria-label="簡報翻閱器">
      <button class="nav prev" id="prev" aria-label="上一頁">‹</button>
      <figure class="slide">
        <img id="slideImg" alt="簡報頁面" />
      </figure>
      <button class="nav next" id="next" aria-label="下一頁">›</button>
    </main>

    <footer class="foot">
      <span id="counter">1 / 9</span>
      <div class="progress"><div class="fill" id="fill"></div></div>
      <span class="footnote">spec → PPTX → PDF · 可重跑只是底層能力</span>
    </footer>

    <script src="app.js"></script>
  </body>
