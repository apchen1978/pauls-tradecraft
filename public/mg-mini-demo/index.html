<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>MG — Mini Demo (Web)</title>
  <style>
    :root {
      --ink: #1c1c1e;
      --muted: #6e6e73;
      --line: #e3e3e6;
      --bg: #f6f4ef;
      --stage: #eef0f3;
      --accent: #e0563a;
      --accent-dark: #c2442c;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px 20px 6px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .stage {
      position: relative;
      flex: 1;
      margin: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--stage);
      overflow: hidden;
      touch-action: none; /* pointer events handle drag */
      min-height: 340px;
    }
    /* dotted "desktop" hint */
    .stage::before {
      content: "";
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(0,0,0,0.07) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
    }
    .hint {
      position: absolute; left: 0; right: 0; bottom: 12px;
      text-align: center;
      font-size: 12px; color: var(--muted);
      pointer-events: none;
    }
    .pet {
      position: absolute;
      left: 50%; top: 50%;
      width: 128px; height: 139px; /* 192x208 @ 2/3 */
      transform: translate(-50%, -50%);
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      image-rendering: auto;
      z-index: 2;
      touch-action: none;
    }
    .pet.dragging { cursor: grabbing; }
    .pet img { width: 100%; height: 100%; display: block; pointer-events: none; }
    .pet .state-label {
      position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
      font-size: 11px; font-weight: 600; color: var(--accent-dark);
      background: rgba(255,255,255,0.85); border: 1px solid var(--line);
      border-radius: 999px; padding: 2px 10px;
      white-space: nowrap;
      opacity: 0; transition: opacity 0.2s;
      pointer-events: none;
    }
    .pet .state-label.show { opacity: 1; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 4px 16px 18px;
    }
    button {
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s, color 0.15s, border-color 0.15s;
    }
    button:hover { border-color: #c9c9cf; }
    button:active { transform: scale(0.96); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    footer {
      text-align: center;
      padding: 0 20px 20px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
    footer .tag {
      display: inline-block;
      font-weight: 600;
      color: var(--accent-dark);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
      margin-bottom: 6px;
      background: #fff;
    }
    @media (max-width: 480px) {
      .pet { width: 112px; height: 121px; }
      button { padding: 8px 14px; font-size: 13px; }
      header h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MG — Desktop Pet</h1>
    <p>Drag MG around. Try Wave / Jump / Sleep.</p>
  </header>

  <div class="stage" id="stage">
    <div class="pet" id="pet" role="img" aria-label="MG desktop pet">
      <img id="petImg" alt="" draggable="false" />
      <span class="state-label" id="stateLabel"></span>
    </div>
    <p class="hint">Press and drag MG to move it</p>
  </div>

  <div class="controls">
    <button type="button" class="primary" id="btnWave">Wave</button>
    <button type="button" id="btnJump">Jump</button>
    <button type="button" id="btnSleep">Sleep</button>
    <button type="button" id="btnReset">Reset</button>
  </div>

  <footer>
    <span class="tag">Web Mini Demo / Portfolio Adaptation</span><br />
    Original: Python + PySide6 Desktop App<br />
    Browser demo of the original artwork — not the complete desktop application.
  </footer>

  <script src="app.js"></script>
</body>
</html>
