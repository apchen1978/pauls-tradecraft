<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3eb">
    <meta name="description" content="先認識一個人今天的處境，再替他挑一個回家的方向。">
    <title>先有fu，再有家 · Feeling First</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="site-head">
      <a class="wordmark" href="/?lang=zh#showcase" aria-label="Paul’s Tradecraft">PAUL’S TRADECRAFT</a>
      <nav class="head-actions" aria-label="Language and navigation">
        <a class="home-link" href="/?lang=zh#showcase" data-copy="back">回到作品集</a>
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" data-lang="zh" aria-pressed="true">繁中</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </nav>
    </header>
    <main id="app" class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow" data-copy="eyebrow">ROOMVERSE · 人機共創示範</p>
        <h1 id="page-title" data-copy="title">先有fu，再有家</h1>
        <small class="fu-note" lang="zh-Hant" hidden>fu＝那個「感覺對了」的感覺。</small>
        <p class="dek" data-copy="dek">先認識一個人今天怎麼了，再問他進門那一刻需要什麼；房間，是這個答案的結果。</p>
        <p class="boundary" data-copy="boundary">示範／虛構情境 · AI 初稿為預置內容，不是即時生成。</p>
      </section>
      <section id="experience" aria-label="Feeling First interaction">
        <div class="progress-row">
          <span class="progress-label" data-copy="progressLabel">探索進度</span>
          <span id="progress-text" class="progress-text" aria-live="polite">第 1／3 步</span>
          <span class="progress-track" aria-hidden="true"><span id="progress-fill"></span></span>
        </div>
        <div id="step-content" aria-live="polite"></div>
      </section>
    </main>
    <footer class="site-foot">
      <span data-copy="footer">一個固定內容的創作示範，不會連接 AI 服務。</span>
      <a href="/prototype/roomverse-3d/?lang=zh" data-copy="roomverse">走進 ROOMVERSE 3D</a>
    </footer>
  </body>
</html>
