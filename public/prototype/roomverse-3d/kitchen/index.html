<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f0e8dc">
  <title>ROOMVERSE 3D</title>
  <style>
    :root { color-scheme: light; --ink:#292c26; --muted:#66685e; --paper:#faf8f2; --olive:#596043; --line:#d4cebf; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#f3efe6; color:var(--ink); font-family:system-ui,"Noto Sans TC",sans-serif; }
    [hidden] { display:none !important; }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px clamp(16px,3vw,40px); }
    .brand { font-size:12px; letter-spacing:.12em; font-weight:800; color:#596043; }
    #lang { min-width:44px; min-height:44px; padding:7px 14px; border:1px solid #a9a38f; border-radius:999px; background:transparent; color:var(--olive); font:700 14px system-ui,sans-serif; cursor:pointer; }
    .intro { max-width:950px; padding:4px clamp(16px,3vw,40px) 14px; }
    h1 { margin:0 0 8px; font-size:clamp(26px,4vw,42px); line-height:1.12; letter-spacing:-.025em; color:#3b4130; }
    .lead { margin:0; max-width:820px; color:var(--muted); font-size:clamp(14px,1.5vw,17px); line-height:1.65; }
    .room { position:relative; margin:0 clamp(12px,2vw,28px); height:min(70vh,720px); min-height:480px; overflow:hidden; border-radius:18px; background:#d4c5ae; box-shadow:0 14px 40px #493a241c; }
    #stage { position:absolute; inset:0; }
    #stage canvas { display:block; width:100%; height:100%; touch-action:none; }
    .room::after { position:absolute; inset:0; content:""; pointer-events:none; background:radial-gradient(ellipse at 50% 48%,transparent 60%,#241c1124 100%); }
    .status { position:absolute; z-index:2; top:50%; left:50%; transform:translate(-50%,-50%); padding:9px 14px; border-radius:999px; background:#fffE; font-size:14px; }
    .immersive-enter,.immersive-exit { display:none; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin:12px clamp(12px,2vw,28px) 0; }
    .moods { display:flex; flex-wrap:wrap; gap:8px; }
    @media (max-width:500px) {
      .toolbar .moods button { flex:1 1 30%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .moods, .moods button, .mood-note { transition:none; scroll-behavior:auto; }
    }
    .moods button,.immersive-enter,.immersive-exit { min-height:44px; padding:9px 14px; border:1px solid #a9a38f; border-radius:999px; background:var(--paper); color:var(--olive); font:700 14px system-ui,sans-serif; cursor:pointer; }
    .moods button[aria-pressed="true"] { background:var(--olive); border-color:var(--olive); color:#fff; }
    button:focus-visible { outline:3px solid #b57943; outline-offset:3px; }
    .mood-note { min-height:1.4em; margin:8px clamp(12px,2vw,28px) 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .note { padding:12px clamp(16px,3vw,40px) 34px; max-width:900px; color:var(--muted); font-size:12px; line-height:1.6; }
    html.room-immersive,html.room-immersive body { overflow:hidden; overscroll-behavior:none; }
    @media (max-width:768px) {
      header { padding:10px 14px; }
      .intro { padding:4px 14px 12px; }
      .room { margin:0 8px; height:clamp(360px,100vw,450px); min-height:360px; border-radius:14px; }
      .immersive-enter:not([hidden]) { display:block; position:absolute; z-index:3; right:10px; bottom:10px; background:#29352de8; border-color:#fff9; color:#fff; }
      .toolbar { margin:10px 8px 0; }
      .note { padding-top:10px; }
    }
    /* Once entered, immersive mode remains usable across orientation changes. */
    .room.is-immersive { position:fixed; z-index:50; inset:0; width:100vw; height:100vh; height:100dvh; min-height:0; margin:0; border-radius:0; }
    .room.is-immersive #stage { height:100%; }
    .room.is-immersive .immersive-enter { display:none; }
    .room.is-immersive .immersive-exit { display:block; position:absolute; z-index:4; top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left)); background:#29352de8; border-color:#fff9; color:#fff; }
    .room.is-immersive + .toolbar { display:none; }
    .room.is-immersive ~ .mood-note { display:none; }
    .room.is-immersive .immersive-controls { display:flex; position:absolute; z-index:4; right:0; bottom:0; left:0; padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)); background:linear-gradient(transparent,#171a14dc 28%); }
    .room.is-immersive .moods { flex-wrap:nowrap; width:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
    .room.is-immersive .moods::-webkit-scrollbar { display:none; }
    .room.is-immersive .moods button { flex:0 0 auto; background:#faf8f2ee; white-space:nowrap; scroll-snap-align:start; }
    .room.is-immersive .moods button[aria-pressed="true"] { background:#596043; color:#fff; }
    header .brand { margin-right:auto; }
    .exit-nav { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 13px; border:1px solid #a9a38f; border-radius:999px; background:var(--paper); color:var(--olive); font:700 13px system-ui,sans-serif; text-decoration:none; cursor:pointer; }
    .exit-nav:focus-visible { outline:3px solid #b57943; outline-offset:3px; }
    .immersive-other-rooms { display:none; }
    .room.is-immersive .immersive-other-rooms { display:inline-flex; position:absolute; z-index:5; top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right)); background:#29352de8; border-color:#fff9; color:#fff; }
  </style>
</head>
<body>
  <header>
    <span class="brand">ROOMVERSE 3D</span>
    <a id="headerOtherRooms" class="exit-nav" href="/prototype/roomverse-3d/?lang=zh">← 其他房間</a>
    <button id="lang" type="button" aria-label="Switch language">EN</button>
  </header>
  <main>
    <section class="intro" aria-labelledby="title">
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
    </section>
    <section class="room" aria-label="Room 03 3D room">
      <div id="stage"></div>
      <p id="status" class="status" role="status"></p>
      <button class="immersive-enter" id="immersiveEnter" type="button" hidden></button>
      <button class="immersive-exit" id="immersiveExit" type="button"></button>
      <div class="immersive-controls" id="immersiveControls"></div>
      <a id="immersiveOtherRooms" class="exit-nav immersive-other-rooms" href="/prototype/roomverse-3d/?lang=zh">← 其他房間</a>
    </section>
    <section class="toolbar" aria-label="Room settings">
      <div class="moods" id="moods" role="group" aria-label="Choose a mood"></div>
    </section>
    <p class="mood-note" id="why" aria-live="polite"></p>
    <p class="note" id="note"></p>
  </main>
  <script type="module" src="page.js?v=42"></script>
</body>
</html>
