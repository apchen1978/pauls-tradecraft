<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f0e8dc">
  <title>ROOMVERSE 3D</title>
  <script>if (["room01", "room02", "room03"].includes(new URLSearchParams(location.search).get("from"))) document.documentElement.classList.add("arriving");</script>
  <link rel="stylesheet" href="../travel-door.css?v=3">
  <style>
    :root { color-scheme: light; --ink:#292c26; --muted:#66685e; --paper:#faf8f2; --brick:#8a4a2b; --line:#d4cebf; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#f3efe6; color:var(--ink); font-family:system-ui,"Noto Sans TC",sans-serif; }
    [hidden] { display:none !important; }
    header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px 12px; padding:14px clamp(16px,3vw,40px); }
    .brand { font-size:12px; letter-spacing:.12em; font-weight:800; color:var(--brick); }
    .header-actions { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px; margin-left:auto; max-width:100%; }
    #portfolioHome, #otherRooms, #lang { min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; padding:7px 14px; border:1px solid #a9a38f; border-radius:999px; background:transparent; color:var(--brick); font:700 14px system-ui,sans-serif; text-decoration:none; white-space:nowrap; cursor:pointer; }
    #lang { min-width:44px; justify-content:center; }
    .intro { max-width:950px; padding:4px clamp(16px,3vw,40px) 14px; }
    h1 { margin:0; font-size:clamp(26px,4vw,42px); line-height:1.12; letter-spacing:-.025em; color:#3d2a1f; }
    .subtitle { margin:4px 0 8px; color:var(--brick); font-size:clamp(15px,1.6vw,18px); font-weight:700; }
    .lead { margin:0; max-width:820px; color:var(--muted); font-size:clamp(14px,1.5vw,17px); line-height:1.65; }
    /* 1440×900: 70vh leaves the mood bar just below the fold. Cap height so the six mood buttons stay on the first screen; the 768px rule below still owns the phone. */
    .room { position:relative; margin:0 clamp(12px,2vw,28px); height:min(70vh, 720px, calc(100dvh - 20rem)); min-height:min(480px, calc(100dvh - 20rem)); overflow:hidden; border-radius:18px; background:#d4c5ae; box-shadow:0 14px 40px #493a241c; }
    #stage { position:absolute; inset:0; }
    .poster { position:absolute; inset:0; z-index:3; display:grid; place-items:center; background:linear-gradient(#0002,#0005), url("/gallery/assets/roomverse-room04-shanghai-slowly-concept-mobile.webp") center / cover no-repeat, #715744; }
    .arriving .poster { display:none; }
    .poster:not([hidden]) + .status { top:68%; }
    .poster button { min-height:48px; padding:12px 24px; border:1px solid #fff9; border-radius:999px; background:#3a2a1fe8; color:#fff; font:700 17px system-ui,sans-serif; cursor:pointer; }
    #stage canvas { display:block; width:100%; height:100%; touch-action:none; }
    .immersive-exit, .immersive-exits, .immersive-controls { display:none; }
    .immersive-enter, .immersive-exit, #immersiveDoor { min-height:44px; padding:8px 14px; border:1px solid #fffa; border-radius:999px; background:#3a2a1fe8; color:white; font:700 14px system-ui,sans-serif; cursor:pointer; white-space:nowrap; }
    .immersive-enter { position:absolute; z-index:6; right:12px; bottom:12px; }
    .room.is-immersive { position:fixed; inset:0; z-index:50; height:100vh; height:100dvh; min-height:0; margin:0; border-radius:0; }
    .is-immersive .immersive-enter { display:none; }
    .is-immersive .immersive-exit { display:block; position:absolute; z-index:7; top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left)); }
    .is-immersive .immersive-exits { display:flex; gap:6px; position:absolute; z-index:7; top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right)); }
    .is-immersive #portfolioHome, .is-immersive #lang { border-color:#fffa; background:#3a2a1fe8; color:white; }
    .is-immersive .immersive-exits > *, .is-immersive .immersive-exit { min-height:44px; padding:7px 10px; font-size:13px; }
    .is-immersive .immersive-controls { display:grid; gap:5px; position:absolute; z-index:7; inset:auto 0 0; padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)); background:#3a2a1fe8; }
    .is-immersive .view-buttons, .is-immersive .moods { display:flex; position:static; flex-wrap:nowrap; min-width:0; gap:6px; overflow-x:auto; overscroll-behavior-inline:contain; scrollbar-width:none; }
    .is-immersive .view-buttons button, .is-immersive .moods button { flex:none; white-space:nowrap; }
    html.room-immersive, html.room-immersive body { overflow:hidden; overscroll-behavior:none; }
    .room-immersive #moodNote { display:none; }
    .status { position:absolute; z-index:4; top:50%; left:50%; transform:translate(-50%,-50%); padding:9px 14px; border-radius:999px; background:#fffE; font-size:14px; }
    .note { padding:12px clamp(16px,3vw,40px) 34px; max-width:900px; color:var(--muted); font-size:12px; line-height:1.6; }
    .toolbar { margin:12px clamp(12px,2vw,28px) 0; }
    .moods { display:flex; flex-wrap:wrap; gap:8px; }
    .moods button { min-height:44px; padding:9px 14px; border:1px solid #a9a38f; border-radius:999px; background:var(--paper); color:var(--brick); font:700 14px system-ui,"Noto Sans TC",sans-serif; cursor:pointer; }
    .moods button[aria-pressed="true"] { background:var(--brick); border-color:var(--brick); color:#fff; }
    .mood-note { min-height:1.4em; margin:8px clamp(12px,2vw,28px) 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .view-buttons { position:absolute; z-index:4; top:10px; left:10px; right:10px; display:flex; flex-wrap:wrap; gap:8px; }
    .center-view[aria-pressed="true"] { background:#c9742e; border-color:#fff; }
    .center-view { min-height:44px; padding:9px 14px; border:1px solid #fff9; border-radius:999px; background:#3a2a1fe8; color:#fff; font:700 14px system-ui,"Noto Sans TC",sans-serif; cursor:pointer; }
    .swap-actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px clamp(12px,2vw,28px) 0; }
    .swap-actions button { min-height:44px; padding:9px 16px; border-radius:999px; font:700 14px system-ui,"Noto Sans TC",sans-serif; cursor:pointer; }
    #randomLook { min-height:44px; padding:9px 16px; border-radius:999px; border:1px solid #bd9848; background:linear-gradient(#f8e0a0,#e8c565); color:#34280f; font:800 14px system-ui,"Noto Sans TC",sans-serif; box-shadow:0 2px 8px #7a5a1a55; } /* the gold tag, as in Rooms 01 to 03 */
    #randomLook:disabled { opacity:.6; cursor:default; }
    #resetLook { border:1px solid #a9a38f; background:var(--paper); color:var(--brick); }
    .swaps { margin:10px clamp(12px,2vw,28px) 0; }
    .swaps summary { min-height:44px; display:flex; align-items:center; cursor:pointer; color:var(--brick); font:700 14px system-ui,"Noto Sans TC",sans-serif; }
    .swap-group { margin:6px 0 12px; } .swap-group h3 { margin:0 0 6px; color:var(--muted); font:600 13px system-ui,"Noto Sans TC",sans-serif; }
    .swap-options { display:flex; flex-wrap:wrap; gap:8px; }
    .swap-options button { min-height:44px; padding:9px 14px; border:1px solid #a9a38f; border-radius:999px; background:var(--paper); color:var(--brick); font:700 14px system-ui,"Noto Sans TC",sans-serif; cursor:pointer; }
    .swap-options button[aria-pressed="true"] { background:var(--brick); border-color:var(--brick); color:#fff; }
    .tap-target { position:absolute; z-index:4; border:0; border-radius:50%; background:transparent; cursor:pointer; padding:0; }
    .tap-target:focus-visible { outline:3px solid #fff; outline-offset:-3px; box-shadow:0 0 0 5px #8a4a2b; }
    .bubble { position:absolute; z-index:5; transform:translate(-50%,-100%); width:max-content; max-width:min(260px,78%); padding:10px 34px 10px 14px; border-radius:14px; background:#fffffaee; color:#2a2f2a; box-shadow:0 6px 20px #0003; font-size:14px; font-weight:600; line-height:1.45; }
    .bubble [data-title] { margin:0 0 2px; font-size:11px; letter-spacing:.14em; color:var(--brick); }
    .bubble [data-line] { margin:0; }
    .bubble [data-travel] { display:inline-flex; align-items:center; min-height:44px; margin-top:4px; color:var(--brick); font-size:13px; font-weight:700; }
    .bubble [data-close] { position:absolute; top:2px; right:2px; width:44px; height:44px; border:0; background:transparent; color:#6a5a4a; font:700 18px system-ui; cursor:pointer; }
    .bubble [hidden] { display:none; }
    a:focus-visible, button:focus-visible { outline:3px solid #b57943; outline-offset:3px; }
    @media (max-width:768px) {
      header { align-items:flex-start; padding:10px 14px; }
      .header-actions { flex:1 1 100%; justify-content:flex-start; }
      #portfolioHome, #otherRooms { font-size:13px; padding:7px 10px; }
      .intro { padding:4px 14px 12px; }
      .room { margin:0 8px; height:clamp(360px,100vw,450px); min-height:360px; border-radius:14px; }
      .note { padding:10px 14px 28px; }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">ROOMVERSE 3D</span>
    <span class="header-actions">
      <a id="portfolioHome" href="/?lang=zh" aria-label="回到作品集首頁">⌂ 作品集首頁</a>
      <a id="otherRooms" href="/prototype/roomverse-3d/?lang=zh">← 其他房間</a>
      <button id="lang" type="button">EN</button>
    </span>
  </header>
  <main>
    <section class="intro" aria-labelledby="title">
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
      <p class="lead" id="lead"></p>
    </section>
    <section class="room" aria-label="Room 04 3D room">
      <div id="stage"></div>
      <div id="poster" class="poster"><button id="enter" type="button">走進咖啡廳</button></div>
      <p id="status" class="status" role="status" hidden></p>
      <div class="view-buttons" id="views" role="group"><button class="center-view" data-view="overview" type="button" aria-pressed="true" hidden></button><button class="center-view" data-view="counter" type="button" aria-pressed="false" hidden></button><button class="center-view" data-view="window" type="button" aria-pressed="false" hidden></button><button class="center-view" data-view="lounge" type="button" aria-pressed="false" hidden></button><button class="center-view" id="centerView" type="button" aria-pressed="false" hidden></button></div>
      <button class="immersive-enter" id="immersiveEnter" type="button" hidden></button>
      <button class="immersive-exit" id="immersiveExit" type="button"></button>
      <div class="immersive-exits" id="immersiveExits"><button id="immersiveDoor" data-travel-door-trigger type="button"></button></div>
      <div class="immersive-controls" id="immersiveControls"></div>
      <button class="tap-target" id="robotHit" type="button" hidden></button>
      <button class="tap-target" id="noteHit" type="button" hidden></button>
      <div class="bubble" id="bubble" role="dialog" hidden><p data-title></p><p data-line></p><a data-travel data-travel-door-trigger href="/prototype/roomverse-3d/"></a><button data-close type="button">×</button></div>
    </section>
    <section class="toolbar" id="roomControls" aria-label="Room settings" hidden>
      <div class="moods" id="moods" role="group"></div>
    </section>
    <div id="moodNote" hidden><p class="mood-note" id="why" aria-live="polite"></p></div>
    <div class="swap-actions" id="swapActions" hidden><button id="randomLook" type="button" disabled></button><button id="resetLook" type="button" hidden></button></div>
    <details class="swaps" id="swaps" hidden><summary id="swapsTitle"></summary><div id="swapGroups"></div></details>
    <p class="note" id="note"></p>
  </main>
  <script type="module" src="page.js?v=45"></script>
</body>
</html>
