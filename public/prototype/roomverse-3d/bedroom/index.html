<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROOMVERSE 3D｜空間幻境 · Room 02 Night Shift（施工中）</title>
<meta name="description" content="ROOMVERSE 像 universe 一樣不只一個房間。第二個房間：都市青年Style 的一人套房，施工中。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ecebe5">
<script>if (new URLSearchParams(location.search).get("from") === "room01") document.documentElement.classList.add("arriving");</script>
<style>
  html.arriving::before { content: ""; position: fixed; inset: 0; z-index: 60; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, #6b5bd8 0%, #2a2150 55%, #0e0c20 100%); opacity: 1; transition: opacity 1s ease; }
  html.arriving.ready::before { opacity: 0; }
  html.arriving .status { z-index: 70; } /* the loading note stays readable on top of the dark cover */
  :root { --ink: #24302c; --paper: #fbfaf6; --moss: #315c5d; --muted: #5b665f; --line: #cfd8d1; --bg: #ecebe5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, "Noto Sans TC", sans-serif; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px clamp(16px, 3vw, 40px); }
  .left { display: flex; align-items: center; gap: 14px; }
  .home { color: var(--moss); text-decoration: none; font-weight: 700; font-size: 14px; padding: 7px 12px; border: 1px solid #a8afa5; border-radius: 999px; }
  .mark { font-weight: 800; letter-spacing: .14em; font-size: 13px; }
  #lang { position: relative; border: 1px solid #a8afa5; background: none; border-radius: 999px; padding: 7px 12px; font-weight: 700; color: var(--moss); cursor: pointer; }
  #lang::before { content: ""; position: absolute; inset: -7px -3px; border-radius: inherit; }
  .intro { padding: 4px clamp(16px, 3vw, 40px) 16px; max-width: 900px; }
  .mark { line-height: 1.3; }
  .room-no { display: block; margin-top: 1px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
  .intro h1 { font-size: clamp(26px, 4vw, 44px); line-height: 1.15; margin: 0 0 10px; color: #0086c8; background: linear-gradient(90deg, #0086c8 0%, #3a5cff 52%, #7b4dff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .intro p { margin: 0; color: var(--muted); line-height: 1.7; font-size: clamp(15px, 1.4vw, 17px); }
  .room { position: relative; margin: 0 clamp(16px, 3vw, 40px); height: min(72vh, 760px); border-radius: 18px; overflow: hidden; background: #ddd6c8; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  .room::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: radial-gradient(ellipse at 50% 46%, transparent 58%, rgba(30,20,12,.22) 100%); } /* a soft lens vignette, like a photograph */
  .poster { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, #cfe0ee 0%, #e8e4d8 58%, #c9b79c 58%, #b7a283 100%); }
  .poster button { font: inherit; font-weight: 700; font-size: 17px; padding: 14px 22px; border: 0; border-radius: 999px; background: var(--moss); color: #fff; cursor: pointer; box-shadow: 0 10px 30px #0003; }
  .poster button:focus-visible { outline: 3px solid #977b42; outline-offset: 3px; }
  .poster small { display: block; margin-top: 8px; text-align: center; color: #24302c; font-size: 13px; }
  .status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fffd; padding: 10px 16px; border-radius: 999px; font-size: 14px; }
  .moods { margin: 12px clamp(16px, 3vw, 40px) 0; }
  .moods .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .moods button { font: inherit; font-size: 14px; font-weight: 700; padding: 10px 14px; min-height: 44px; border-radius: 999px; border: 1px solid #a8afa5; background: var(--paper); color: var(--moss); cursor: pointer; }
  .moods button[aria-pressed="true"] { background: var(--moss); color: #fff; border-color: var(--moss); }
  .moods button:focus-visible { outline: 3px solid #977b42; outline-offset: 2px; }
  .moods p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; min-height: 1.6em; }
  .swaps { margin: 18px clamp(16px, 3vw, 40px) 0; }
  .swaps h2 { font-size: 16px; margin: 0 0 8px; }
  .swaps .group { margin: 0 0 12px; }
  .swaps .glabel { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .swaps .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .swaps button { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 13px; min-height: 44px; border-radius: 999px; border: 1px solid #a8afa5; background: var(--paper); color: var(--moss); cursor: pointer; }
  .swaps button[aria-pressed="true"] { background: var(--moss); color: #fff; border-color: var(--moss); }
  .swaps button:focus-visible { outline: 3px solid #977b42; outline-offset: 2px; }
  .note { padding: 14px clamp(16px, 3vw, 40px) 40px; color: var(--muted); font-size: 13px; line-height: 1.7; max-width: 900px; }
  @media (max-width: 768px) {
    .room { height: auto; }
    #stage { position: relative; height: 58vh; }
    .poster { height: 58vh; bottom: auto; }
    .mark { font-size: 11px; letter-spacing: .1em; }
  }
</style>
</head>
<body>
<header>
  <div class="left"><a class="home" id="home" href="../">← Room 01</a><span class="mark">ROOMVERSE 3D<span class="room-no" id="roomNo">Room 02 · Night Shift</span></span></div>
  <button id="lang" type="button">EN</button>
</header>
<section class="intro">
  <h1 id="title"></h1>
  <p id="lead"></p>
</section>
<section class="room" aria-labelledby="title">
  <div id="stage"></div>
  <div class="poster" id="poster"><div><button id="enter" type="button"></button><small id="size"></small></div></div>
  <p class="status" id="status" hidden></p>
</section>
<section class="moods" id="moods" hidden aria-labelledby="moodsLabel"><p id="moodsLabel" hidden></p><div class="row" id="moodRow" role="group"></div><p id="why" aria-live="polite"></p></section>
<section class="swaps" id="swaps" hidden aria-labelledby="swapsTitle"><h2 id="swapsTitle"></h2><div id="swapGroups"></div></section>
<p class="note" id="note"></p>
<script type="module" src="page.js?v=9"></script>
</body>
</html>
