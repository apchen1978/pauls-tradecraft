<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROOMVERSE 3D｜空間幻境 · Room 02 Brooklyn Studio</title>
<meta name="description" content="ROOMVERSE 像 universe 一樣不只一個房間。第二個房間：Brooklyn Studio 的一人套房，六種感覺、處處可以換。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ecebe5">
<script>if (new URLSearchParams(location.search).get("from") === "room01") document.documentElement.classList.add("arriving");</script>
<link rel="stylesheet" href="../travel-door.css?v=1">
<style>
  html.arriving::before { content: ""; position: fixed; inset: 0; z-index: 60; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, #6b5bd8 0%, #2a2150 55%, #0e0c20 100%); opacity: 1; transition: opacity 1s ease; }
  html.arriving.ready::before { opacity: 0; }
  html.arriving .status { z-index: 70; } /* the loading note stays readable on top of the dark cover */
  :root { --ink: #24302c; --paper: #fbfaf6; --moss: #315c5d; --muted: #5b665f; --line: #cfd8d1; --bg: #ecebe5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, "Noto Sans TC", sans-serif; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px clamp(16px, 3vw, 40px); }
  .left { display: flex; align-items: center; gap: 14px; }
  .home { color: var(--moss); text-decoration: none; font-weight: 700; font-size: 14px; padding: 7px 12px; border: 1px solid #a8afa5; border-radius: 999px; }
  .mark { font-weight: 800; letter-spacing: .14em; font-size: 13px; }
  #lang { position: relative; border: 1px solid #a8afa5; background: none; border-radius: 999px; padding: 7px 12px; font-weight: 700; color: var(--moss); cursor: pointer; }
  #lang::before { content: ""; position: absolute; inset: -7px -3px; border-radius: inherit; }
  .intro { padding: 4px clamp(16px, 3vw, 40px) 16px; max-width: 900px; }
  .mark { line-height: 1.3; }
  .room-no { display: block; margin-top: 1px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
  .intro h1 { font-size: clamp(26px, 4vw, 44px); line-height: 1.15; margin: 0 0 10px; color: #0086c8; background: linear-gradient(90deg, #0086c8 0%, #3a5cff 52%, #7b4dff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .intro p { margin: 0; color: var(--muted); line-height: 1.7; font-size: clamp(15px, 1.4vw, 17px); }
  .room { position: relative; margin: 0 clamp(16px, 3vw, 40px); height: min(72vh, 760px); border-radius: 18px; overflow: hidden; background: #ddd6c8; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  .room::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: radial-gradient(ellipse at 50% 46%, transparent 58%, rgba(30,20,12,.22) 100%); } /* a soft lens vignette, like a photograph */
  .poster { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, #0003 0%, #0000 35%, #0006 100%), url("poster-night-desktop.webp") center / cover no-repeat, #1b1c22; }
  .poster > div { text-align: center; }
  .poster button { font: inherit; font-weight: 700; font-size: 17px; padding: 14px 22px; border: 0; border-radius: 999px; background: var(--moss); color: #fff; cursor: pointer; box-shadow: 0 10px 30px #0003; }
  .poster button:focus-visible { outline: 3px solid #977b42; outline-offset: 3px; }
  .poster small { display: block; width: fit-content; max-width: 88%; margin: 10px auto 0; padding: 5px 12px; border-radius: 999px; background: #fffc; text-align: center; color: #24302c; font-size: 13px; line-height: 1.4; }
  .robot-hit { position: absolute; z-index: 4; width: 64px; height: 64px; padding: 0; border: 0; border-radius: 50%; background: transparent; transform: translate(-50%, -50%); cursor: pointer; touch-action: manipulation; }
  .robot-hit:focus-visible { outline: 3px solid #5a4cc8; outline-offset: 2px; }
  .robot-bubble { position: absolute; z-index: 5; transform: translateX(-50%); max-width: min(260px, 78%); padding: 9px 13px; border-radius: 14px; background: #fffc; color: #24302c; box-shadow: 0 5px 18px #0003; font-size: 14px; font-weight: 700; line-height: 1.4; text-align: center; pointer-events: none; cursor: default; }
  .immersive-enter, .immersive-exit, .immersive-door, .immersive-controls { display: none; }
  .portal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 14px clamp(16px, 3vw, 40px) 0; }
  .portal button { font: inherit; font-weight: 700; font-size: 15px; min-height: 48px; padding: 12px 20px; border: 1px solid #5a4cc8; border-radius: 999px; background: linear-gradient(90deg, #f6f3ff 0%, #ece6ff 100%); color: #3a2f9e; cursor: pointer; }
  .portal button:focus-visible { outline: 3px solid #977b42; outline-offset: 3px; }
  .portal span { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fffd; padding: 10px 16px; border-radius: 999px; font-size: 14px; }
  .views { margin: 12px clamp(16px, 3vw, 40px) 0; }
  .views .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .views button { font: inherit; font-size: 14px; font-weight: 700; padding: 10px 14px; min-height: 44px; border-radius: 999px; border: 1px solid #a8afa5; background: transparent; color: var(--ink); cursor: pointer; }
  .views button[aria-pressed="true"] { border-color: var(--moss); background: #e3ece8; color: var(--moss); }
  .views button:focus-visible { outline: 3px solid #977b42; outline-offset: 2px; }
  .moods { margin: 12px clamp(16px, 3vw, 40px) 0; }
  .moods .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .moods button { font: inherit; font-size: 14px; font-weight: 700; padding: 10px 14px; min-height: 44px; border-radius: 999px; border: 1px solid #a8afa5; background: var(--paper); color: var(--moss); cursor: pointer; }
  .moods button.shuffle { background: var(--moss); color: #fff; border-color: var(--moss); }
  .moods button[aria-pressed="true"] { background: var(--moss); color: #fff; border-color: var(--moss); }
  .moods button:focus-visible { outline: 3px solid #977b42; outline-offset: 2px; }
  .moods p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; min-height: 1.6em; }
  .swaps { margin: 18px clamp(16px, 3vw, 40px) 0; }
  .swaps summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 10px 16px; border: 1px solid #a8afa5; border-radius: 14px; background: var(--paper); color: var(--ink); font-size: 16px; font-weight: 800; cursor: pointer; }
  .swaps summary::-webkit-details-marker { display: none; }
  .swaps summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--moss); }
  .swaps[open] summary::after { content: "−"; }
  .swaps summary:focus-visible { outline: 3px solid #977b42; outline-offset: 2px; }
  .swaps[open] summary { margin-bottom: 12px; }
  .swaps .group { margin: 0 0 12px; }
  .swaps .glabel { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .swaps .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .swaps button { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 13px; min-height: 44px; border-radius: 999px; border: 1px solid #a8afa5; background: var(--paper); color: var(--moss); cursor: pointer; }
  .swaps button[aria-pressed="true"] { background: var(--moss); color: #fff; border-color: var(--moss); }
  .swaps button:focus-visible { outline: 3px solid #977b42; outline-offset: 2px; }
  .note { padding: 14px clamp(16px, 3vw, 40px) 40px; color: var(--muted); font-size: 13px; line-height: 1.7; max-width: 900px; }
  @media (max-width: 768px) {
    .views .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .views button { width: 100%; padding: 10px 4px; border-radius: 14px; font-size: 13px; }
    .moods .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .moods button { width: 100%; padding: 10px 8px; border-radius: 14px; }
    .moods button.shuffle { grid-column: 1 / -1; }
    .room { height: auto; }
    #stage { position: relative; height: 58vh; }
    .poster { height: 58vh; bottom: auto; background: linear-gradient(180deg, #0003 0%, #0000 35%, #0006 100%), url("poster-night-mobile.webp") center / cover no-repeat, #1b1c22; }
    .mark { font-size: 11px; letter-spacing: .1em; }
  }
  @media (max-width: 768px), (max-width: 1024px) and (max-height: 500px) {
    .immersive-enter:not([hidden]) { display: block; position: absolute; z-index: 6; right: 12px; bottom: 12px; }
    .immersive-enter, .immersive-exit, .immersive-door { min-width: 44px; min-height: 44px; padding: 8px 14px; border: 1px solid #fffa; border-radius: 999px; background: #24302ce8; color: #fff; font: 700 14px system-ui, sans-serif; cursor: pointer; }
    .room.is-immersive { position: fixed; inset: 0; z-index: 50; width: 100vw; height: 100vh; height: 100dvh; margin: 0; border-radius: 0; background: #1b1c22; }
    .room.is-immersive #stage { position: absolute; inset: 0; height: 100%; }
    .room.is-immersive .immersive-enter { display: none; }
    .room.is-immersive .immersive-exit, .room.is-immersive .immersive-door { display: block; position: absolute; z-index: 7; top: calc(8px + env(safe-area-inset-top)); }
    .room.is-immersive .immersive-exit { left: calc(8px + env(safe-area-inset-left)); }
    .room.is-immersive .immersive-door { right: calc(8px + env(safe-area-inset-right)); }
    .room.is-immersive .immersive-controls { display: flex; position: absolute; z-index: 7; right: 0; bottom: 0; left: 0; flex-direction: column; gap: 5px; padding: 8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)); background: linear-gradient(transparent, #17201add 20%); }
    .room.is-immersive .views, .room.is-immersive .moods { margin: 0; min-width: 0; }
    .room.is-immersive .views .row, .room.is-immersive .moods .row { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: none; }
    .room.is-immersive .views .row::-webkit-scrollbar, .room.is-immersive .moods .row::-webkit-scrollbar { display: none; }
    .room.is-immersive .views button, .room.is-immersive .moods button { flex: 0 0 auto; width: auto; min-height: 44px; padding: 8px 13px; border-radius: 999px; background: #f9f7edee; color: #24302c; white-space: nowrap; }
    .room.is-immersive .views button[aria-pressed="true"], .room.is-immersive .moods button[aria-pressed="true"], .room.is-immersive .moods button.shuffle { background: #315c5d; color: #fff; }
    .room.is-immersive .moods p { display: none; }
  }
  html.room-immersive, html.room-immersive body { overflow: hidden; overscroll-behavior: none; }
  .portal .travel-door-trigger { border-color: #aab5aa; background: #fbfaf6; color: #315c5d; }
  .robot-bubble { pointer-events: auto; }
  .robot-bubble [data-travel-door-action] { display: block; min-height: 44px; margin: 7px auto 0; padding: 8px 12px; border: 1px solid #aab5aa; border-radius: 999px; background: #fbfaf6; color: #315c5d; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .robot-bubble [data-travel-door-action]:focus-visible { outline: 3px solid #977b42; outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <div class="left"><a class="home" id="home" href="../">← Room 01</a><span class="mark">ROOMVERSE 3D<span class="room-no" id="roomNo">Room 02 · Brooklyn Studio</span></span></div>
  <button id="lang" type="button">EN</button>
</header>
<section class="intro">
  <h1 id="title"></h1>
  <p id="lead"></p>
</section>
<section class="room" aria-labelledby="title">
  <div id="stage"></div>
  <div class="poster" id="poster"><div><button id="enter" type="button"></button><small id="size"></small></div></div>
  <p class="status" id="status" hidden></p>
  <button class="robot-hit" id="robotHitTarget" type="button" hidden></button>
  <div class="robot-bubble" id="robotBubble" hidden><span data-bubble-copy aria-live="polite"></span><button class="travel-door-trigger" data-travel-door-trigger data-travel-door-action type="button" hidden></button></div>
  <button class="immersive-enter" id="immersiveEnter" type="button" hidden></button>
  <button class="immersive-exit" id="immersiveExit" type="button"></button>
  <button class="immersive-door" id="immersiveDoor" type="button"></button>
  <div class="immersive-controls" id="immersiveControls"></div>
</section>
<p class="portal" id="portalRow" hidden><button id="portalBtn" type="button"></button><button id="travelDoorBtn" data-travel-door-trigger type="button"></button><span id="portalHint"></span></p>
<section class="views" id="views" hidden aria-label="views"><div class="row" id="viewRow" role="group"></div></section>
<section class="moods" id="moods" hidden aria-labelledby="moodsLabel"><p id="moodsLabel" hidden></p><div class="row" id="moodRow" role="group"></div><p id="why" aria-live="polite"></p></section>
<details class="swaps" id="swaps" hidden><summary id="swapsTitle"></summary><div id="swapGroups"></div></details>
<p class="note" id="note"></p>
<script type="module" src="page.js?v=79"></script>
</body>
</html>
