<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROOMVERSE 3D｜空間幻境</title>
<meta name="description" content="換一道光，房間就換了心情。換牆、換地毯、換窗簾的 3D 軟裝房間，插畫示意。">
<meta name="theme-color" content="#ecebe5">
<meta property="og:type" content="website">
<meta property="og:title" content="ROOMVERSE 3D｜空間幻境">
<meta property="og:description" content="換一道光，房間就換了心情。換牆、換地毯、換窗簾，看同一個家的不同表情。">
<meta property="og:image" content="https://paulstradecraft.com/prototype/roomverse-3d/og-roomverse-3d.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="3D 軟裝房間：米白沙發、兩個抱枕、條紋地毯和窗邊的落地燈。">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --ink: #24302c; --paper: #fbfaf6; --moss: #315c5d; --muted: #5b665f; --line: #cfd8d1; --bg: #ecebe5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, "Noto Sans TC", sans-serif; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px clamp(16px, 3vw, 40px); }
  .left { display: flex; align-items: center; gap: 14px; }
  .home { color: var(--moss); text-decoration: none; font-weight: 700; font-size: 14px; padding: 7px 12px; border: 1px solid #a8afa5; border-radius: 999px; }
  .mark { font-weight: 800; letter-spacing: .14em; font-size: 13px; }
  #lang { position: relative; border: 1px solid #a8afa5; background: none; border-radius: 999px; padding: 7px 12px; font-weight: 700; color: var(--moss); cursor: pointer; }
  #lang::before { content: ""; position: absolute; inset: -7px -3px; border-radius: inherit; }
  .intro { padding: 4px clamp(16px, 3vw, 40px) 16px; max-width: 900px; }
  .intro h1 { font-size: clamp(26px, 4vw, 44px); line-height: 1.15; margin: 0 0 10px; color: #0086c8; background: linear-gradient(90deg, #0086c8 0%, #3a5cff 52%, #7b4dff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .intro p { margin: 0; color: var(--muted); line-height: 1.7; font-size: clamp(15px, 1.4vw, 17px); }
  .origin-hint { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; margin: 0 clamp(16px, 3vw, 40px) 12px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid #977b42; border-radius: 10px; background: color-mix(in srgb, var(--paper) 92%, transparent); }
  .origin-hint[hidden] { display: none; }
  .origin-hint p { min-width: 0; margin: 0; color: var(--ink); font-size: 13px; line-height: 1.5; }
  .origin-hint a { color: var(--moss); font-size: 13px; font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; white-space: nowrap; }
  .origin-hint button { min-width: 40px; min-height: 40px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; }
  .origin-hint a:focus-visible, .origin-hint button:focus-visible { outline: 3px solid #977b42; outline-offset: 2px; }
  .room { position: relative; margin: 0 clamp(16px, 3vw, 40px); height: min(72vh, 760px); border-radius: 18px; overflow: hidden; background: #ddd6c8; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  .director-stop { position: absolute; z-index: 3; left: 12px; top: 12px; padding: 9px 14px; border: 1px solid #7e683d; border-radius: 999px; background: #fff9ec; color: #42351c; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 10px #0003; }
  .director-stop[hidden] { display: none; }
  .director-stop:focus-visible { outline: 3px solid #977b42; outline-offset: 3px; }
  .poster { position: absolute; inset: 0; display: grid; place-items: center; background: center / cover no-repeat url("poster-desktop.webp"); }
  .poster button { font: inherit; font-weight: 700; font-size: 17px; padding: 14px 22px; border: 0; border-radius: 999px; background: var(--moss); color: #fff; cursor: pointer; box-shadow: 0 10px 30px #0003; }
  .poster small { display: block; margin-top: 8px; text-align: center; color: #fff; text-shadow: 0 1px 6px #0008; font-size: 13px; }
  .panel { position: absolute; right: 14px; top: 14px; width: 290px; max-height: calc(100% - 28px); overflow: auto; background: color-mix(in srgb, var(--paper) 93%, transparent); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: 0 8px 28px #0002; }
  .panel h2 { font-size: 12px; letter-spacing: .08em; margin: 10px 0 6px; color: var(--muted); }
  .panel h2:first-child { margin-top: 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts button { position: relative; font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .opts button::before { content: ""; position: absolute; inset: -7px -3px; border-radius: inherit; }
  .opts button[aria-pressed="true"] { background: var(--moss); border-color: var(--moss); color: #fff; }
  .camera-actions { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .camera-actions button { min-height: 48px; border: 1px solid #a8afa5; border-radius: 10px; background: #fff; color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .camera-actions button[aria-pressed="true"] { border-color: var(--moss); background: var(--moss); color: #fff; }
  .camera-heading { margin-top: 0 !important; }
  .hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
  .panel .why { margin: 8px 0 2px; font-size: 12.5px; line-height: 1.6; color: var(--ink); background: color-mix(in srgb, var(--moss) 8%, transparent); border-left: 3px solid var(--moss); padding: 6px 9px; border-radius: 0 8px 8px 0; }
  .panel .save { margin-top: 10px; width: 100%; font: inherit; font-weight: 700; font-size: 13px; padding: 8px 12px; border: 1px solid var(--moss); background: none; color: var(--moss); border-radius: 999px; cursor: pointer; }
  .panel .save.shuffle { background: var(--moss); color: #fff; }
  .panel .director { border-color: #977b42; color: #554422; background: #fbf5e8; }
  .panel button:focus-visible { outline: 3px solid #977b42; outline-offset: 2px; }
  .director-still { margin-top: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .director-phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .director-phase { padding: 7px 4px; border-radius: 6px; font-size: 11px; text-align: center; line-height: 1.35; color: var(--ink); }
  .director-phase > span:last-child { display: block; margin-top: 6px; }
  .director-mini-room { position: relative; display: block; height: 58px; overflow: hidden; border-radius: 5px; background: linear-gradient(#d8cec0 68%, #b39a7b 68%); }
  .director-mini-room::after { content: ""; position: absolute; left: 31%; right: 15%; bottom: 8px; height: 17px; border-radius: 5px 5px 2px 2px; background: #857b70; box-shadow: 0 5px 0 -2px #554b40; }
  .director-mini-window { position: absolute; left: 8px; top: 7px; width: 25%; height: 29px; border: 3px solid #76563d; background: #95a5a8; }
  .director-mini-lamp { position: absolute; right: 9px; top: 14px; width: 10px; height: 15px; background: #fff0bf; clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  .phase-0 .director-mini-room { background: linear-gradient(#aaa09a 68%, #8a7a70 68%); }
  .phase-0 .director-mini-window { background: #758998; }
  .phase-0 .director-mini-lamp { box-shadow: 0 0 13px 7px #f6d79a; }
  .phase-1 .director-mini-room { background: linear-gradient(#eee1c9 68%, #c7a57c 68%); }
  .phase-1 .director-mini-window { background: #b7d7e3; }
  .phase-1 .director-mini-lamp { background: #eee0bb; }
  .phase-2 .director-mini-room { background: linear-gradient(#9493a2 68%, #716d77 68%); }
  .phase-2 .director-mini-window { background: #273b62; }
  .phase-2 .director-mini-lamp { box-shadow: 0 0 13px 7px #f8d5a0; }
  .director-still p { margin: 7px 0 0; font-size: 12px; line-height: 1.55; }
  .status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fffd; padding: 10px 16px; border-radius: 999px; font-size: 14px; }
  .note { padding: 14px clamp(16px, 3vw, 40px) 40px; color: var(--muted); font-size: 13px; line-height: 1.7; max-width: 900px; }
  .panel-toggle { position: absolute; z-index: 3; right: 14px; top: 14px; padding: 9px 14px; border: 1px solid var(--moss); border-radius: 999px; background: color-mix(in srgb, var(--paper) 93%, transparent); color: var(--moss); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px #0002; transition: right .25s ease; }
  .panel-toggle:focus-visible { outline: 3px solid #977b42; outline-offset: 3px; }
  @media (min-width: 701px) {
    .panel { transition: transform .25s ease, visibility 0s; }
    .room:not(.panel-open) .panel:not(:has(.director-still)) { transform: translateX(calc(100% + 20px)); visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
    .room.panel-open .panel-toggle { right: 318px; }
  }
  @media (max-width: 700px) {
    .origin-hint { grid-template-columns: minmax(0, 1fr) auto; gap: 7px 9px; margin-bottom: 10px; padding: 9px 10px; }
    .origin-hint p { grid-column: 1 / -1; }
    .origin-hint a { white-space: normal; }
    .panel-toggle { display: none; }
    .room { height: auto; aspect-ratio: auto; }
    #stage { position: relative; height: 58vh; }
    .poster { position: absolute; inset: 0; bottom: auto; height: 58vh; background-image: url("poster-mobile.webp"); }
    /* Reserve room for the longer English introduction and both view controls on short phones. */
    html[lang="en"] #stage, html[lang="en"] .poster { height: clamp(240px, calc(100svh - 400px), 53vh); }
    .panel { position: static; width: auto; max-height: none; border-radius: 0 0 18px 18px; border-width: 1px 0 0; box-shadow: none; }
    .mark { font-size: 11px; letter-spacing: .1em; }
  }
</style>

</head>
<body>
<header>
  <div class="left"><a class="home" id="home" href="/">← 作品集</a><span class="mark">ROOMVERSE 3D</span></div>
  <button id="lang" type="button">EN</button>
</header>
<section class="intro">
  <h1 id="title"></h1>
  <p id="lead"></p>
</section>
<aside class="origin-hint" id="originHint" role="note" hidden>
  <p id="originStory"></p>
  <a id="originBack" href="/prototype/feeling-to-room/"></a>
  <button id="originClose" type="button"></button>
</aside>
<section class="room" aria-labelledby="title">
  <div id="stage"></div>
  <div class="poster" id="poster"><div><button id="enter" type="button"></button><small id="size"></small></div></div>
  <p class="status" id="status" hidden></p>
  <button class="panel-toggle" id="panelToggle" type="button" aria-controls="panel" aria-expanded="false" hidden></button>
  <div class="panel" id="panel" hidden></div>
</section>
<p class="note" id="note"></p>
<script type="module" src="page.js?v=9"></script>
</body>
</html>
