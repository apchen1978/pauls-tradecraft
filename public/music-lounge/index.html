<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>人機協作 Music Lounge · Paul’s Tradecraft</title>
  <meta name="description" content="ROOMVERSE 原創程式生成音樂。挑一首，點了再聽。Original generative music from ROOMVERSE. Choose a track and press play.">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="styles.css?v=4">
  <script type="module" src="app.js?v=6"></script>
</head>
<body>
  <a class="skip" href="#tracks" id="skip">跳至曲目</a>
  <header class="top">
    <a class="brand" id="home" href="/?lang=zh">Paul’s Tradecraft</a>
    <nav aria-label="Language" class="languages">
      <a href="?lang=zh" lang="zh-Hant">中文</a>
      <a href="?lang=en" lang="en">EN</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <section class="intro" aria-labelledby="title">
      <p class="eyebrow">PAUL × AI</p>
      <h1 id="title">人機協作 Music Lounge</h1>
      <p class="lead" id="subtitle">從晨曦的鋼琴、午後的爵士鼓，到夜晚的旋律。</p>
      <p class="split" id="split">Paul 定方向、用耳朵把關；AI 寫譜與演奏</p>
      <p class="credit" id="credit">Paul × AI 共同創作</p>
      <p class="hint" id="hint">挑一首，點了再聽。一次播放一首。</p>
    </section>
    <div id="tracks">
      <section class="feel feel-morning" aria-labelledby="morning-title">
        <div class="section-heading">
          <h2 id="morning-title">早晨</h2>
          <p id="morning-note">窗邊的第一道光。</p>
        </div>
        <ol class="track-list" id="morning-list"></ol>
      </section>
      <section class="feel feel-afternoon" aria-labelledby="afternoon-title">
        <div class="section-heading">
          <h2 id="afternoon-title">午後</h2>
          <p id="afternoon-note">日光、弄堂，和一間明亮的舞廳。</p>
        </div>
        <ol class="track-list" id="afternoon-list"></ol>
      </section>
      <section class="feel feel-night" aria-labelledby="night-title">
        <div class="section-heading">
          <h2 id="night-title">夜晚</h2>
          <p id="night-note">慢板、雨，和夜色裡的旋律。</p>
        </div>
        <ol class="track-list" id="night-list"></ol>
      </section>
    </div>
  </main>
  <footer class="foot">
    <a id="back" href="/ai-lab/?lang=zh#gallery-front">回到 AI Lab</a>
    <span>ROOMVERSE</span>
  </footer>
</body>
</html>
