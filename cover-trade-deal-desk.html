<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist Variable";
    src: url("public/fonts/geist-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  :root {
    --bone: #f4f5f0;
    --ink: #17271f;
    --forest: #1f4d3a;
    --moss: #3a6b52;
    --amber: #a05a10;
    --gold: #c9973f;
    --line: #d9ded4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1440px; height: 810px; overflow: hidden;
    font-family: "Geist Variable", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bone); color: var(--ink);
  }
  .cover { position: relative; width: 1440px; height: 810px; padding: 48px 72px; display: flex; flex-direction: column; overflow: hidden; }
  .grid {
    position: absolute; inset: 0; opacity: 0.05;
    background-image: linear-gradient(rgba(23,39,31,0.6) 1px, transparent 1px), linear-gradient(90deg, rgba(23,39,31,0.6) 1px, transparent 1px);
    background-size: 56px 56px; pointer-events: none;
  }
  .deco { position: absolute; border: 1.5px solid rgba(31,77,58,0.10); border-radius: 50%; }
  .deco.d1 { width: 360px; height: 360px; right: -110px; top: -130px; }
  .deco.d2 { width: 220px; height: 220px; left: -70px; bottom: -90px; border-color: rgba(160,90,16,0.10); }
  .top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: var(--moss); }
  .kicker { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--amber); }
  .main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 20px; }
  .title { font-size: 84px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; color: var(--forest); max-width: 1100px; }
  .flow { display: flex; align-items: center; gap: 24px; margin-top: 44px; flex-wrap: nowrap; }
  .flow .lbl { font-size: 26px; font-weight: 700; color: var(--forest); line-height: 1.2; }
  .flow .lbl.gold { color: var(--amber); }
  .flow .arrow { font-size: 36px; color: var(--gold); font-weight: 700; }
  .chips { display: flex; gap: 16px; margin-top: 48px; flex-wrap: nowrap; }
  .chip { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 16px 24px; min-width: 200px; }
  .chip .k { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: var(--moss); }
  .chip .v { font-size: 22px; font-weight: 700; margin-top: 5px; color: var(--ink); }
  .chip.amber { border-color: #e3cdb0; background: #fbf6ee; }
  .chip.amber .v { color: var(--amber); }
  .bottom { position: relative; display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 24px; }
  .tagline { font-size: 17px; font-weight: 600; color: var(--moss); }
  .disclaimer { font-size: 12px; color: #8a958d; text-align: right; max-width: 640px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="cover">
    <div class="grid"></div>
    <div class="deco d1"></div>
    <div class="deco d2"></div>
    <div class="top">
      <span class="brand">Paul's Tradecraft</span>
      <span class="kicker">Check first, then commit</span>
    </div>
    <div class="main">
      <div class="title">Check before<br>you commit.</div>
      <div class="flow">
        <span class="lbl">Quote</span><span class="arrow">→</span>
        <span class="lbl">Cost</span><span class="arrow">→</span>
        <span class="lbl">Payment terms</span><span class="arrow">→</span>
        <span class="lbl">Evidence</span><span class="arrow">→</span>
        <span class="lbl gold">Decision</span>
      </div>
      <div class="chips">
        <div class="chip"><div class="k">Inputs</div><div class="v">side by side</div></div>
        <div class="chip"><div class="k">Rules</div><div class="v">rerunnable</div></div>
        <div class="chip amber"><div class="k">Gaps</div><div class="v">marked UNKNOWN</div></div>
        <div class="chip"><div class="k">Next</div><div class="v">a person decides</div></div>
      </div>
    </div>
    <div class="bottom">
      <span class="tagline">Put the terms on one page. Then decide.</span>
      <span class="disclaimer">Static demo · demo data · no real customers</span>
    </div>
  </div>
</body>
</html>
