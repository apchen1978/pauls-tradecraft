name: Room 04 physics audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  physics-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test tests/roomverse-room04-physics.spec.js
