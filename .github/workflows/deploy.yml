name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install CJK fonts (small, fast apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - name: Download headless Chrome (fast, no snap)
        run: |
          mkdir -p .chrome
          curl -sL -o /tmp/cft.json "https://storage.googleapis.com/chrome-for-testing-public/last-known-good-versions-with-downloads.json"
          CHROME_URL=$(node -e "const j=require('/tmp/cft.json');console.log(j.channels.Stable.downloads.chromeHeadlessShell.find(d=>d.platform==='linux64').url)")
          echo "CHROME_URL=$CHROME_URL" >> "$GITHUB_ENV"
          curl -sL -o .chrome/shell.zip "$CHROME_URL"
          cd .chrome && unzip -q shell.zip && rm shell.zip && cd ..
          ls .chrome/chrome-headless-shell-linux64/
      - name: Generate one-pager PDF (data-driven)
        run: node scripts/make-onepager.mjs
        env:
          CHROME_PATH: ${{ github.workspace }}/.chrome/chrome-headless-shell-linux64/chrome-headless-shell
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
