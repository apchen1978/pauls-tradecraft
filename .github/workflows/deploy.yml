name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install CJK fonts (apt, with direct-download fallback)
        run: |
          # 1) 嘗試 apt（限時，避免 hang）
          timeout 120 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 update -qq || echo "apt update failed, trying fallback"
          timeout 120 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 install -y -qq --no-install-recommends fonts-noto-cjk || echo "apt install failed, trying fallback"
          # 2) 驗證；若 Noto CJK 未就緒，直接下載正式 OTF（雙保險）
          if ! fc-list 2>/dev/null | grep -qi "Noto Sans CJK"; then
            echo "Noto CJK missing, downloading official OTF"
            sudo mkdir -p /usr/share/fonts/opentype/noto-cjk
            curl -sL --retry 3 -o /tmp/NotoSansCJKtc.otf "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf"
            ls -la /tmp/NotoSansCJKtc.otf
            sudo cp /tmp/NotoSansCJKtc.otf /usr/share/fonts/opentype/noto-cjk/
            sudo fc-cache -f > /dev/null 2>&1 || true
          fi
          # 3) 最終驗證：沒有 CJK 字型就明確失敗（不讓壞 artifact 上線）
          fc-list 2>/dev/null | grep -i "noto sans cjk" | head -3
          fc-list 2>/dev/null | grep -qi "noto sans cjk" || { echo "FATAL: no CJK font available"; exit 1; }
      - name: Cache Chrome binary
        id: cache-chrome
        uses: actions/cache@v4
        with:
          path: .chrome/chrome-linux64
          key: chrome-linux64-${{ runner.os }}
      - name: Download headless Chrome (fast, no snap)
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          mkdir -p .chrome
          curl -sL -o /tmp/cft.json "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          CHROME_URL=$(node -e "const j=require('/tmp/cft.json');console.log(j.channels.Stable.downloads.chrome.find(d=>d.platform==='linux64').url)")
          echo "CHROME_URL=$CHROME_URL" >> "$GITHUB_ENV"
          curl -sL -o .chrome/chrome.zip "$CHROME_URL"
          cd .chrome && unzip -q chrome.zip && rm chrome.zip && cd ..
          ls .chrome/chrome-linux64/chrome
      - name: Generate one-pager PDF (data-driven)
        run: node scripts/make-onepager.mjs
        env:
          CHROME_PATH: ${{ github.workspace }}/.chrome/chrome-linux64/chrome
      - name: Build
        run: npm run build
      - name: Health check before deploy (fail fast)
        run: |
          set -e
          echo "== Checking dist artifacts =="
          test -f dist/robots.txt && echo "OK robots.txt" || { echo "FAIL robots.txt missing"; exit 1; }
          test -f dist/sitemap.xml && echo "OK sitemap.xml" || { echo "FAIL sitemap.xml missing"; exit 1; }
          test -f dist/files/Paul-Tradecraft-OnePager.pdf && echo "OK one-pager.pdf" || { echo "FAIL one-pager.pdf missing"; exit 1; }
          SIZE=$(stat -c%s dist/files/Paul-Tradecraft-OnePager.pdf)
          echo "one-pager.pdf size: $SIZE bytes"
          test "$SIZE" -gt 10240 || { echo "FAIL one-pager.pdf too small (possibly blank render)"; exit 1; }
          # PDF 字形驗證：內嵌 CJK 字型（Noto/JhengHei/PingFang）否則中文是 tofu
          python3 scripts/check-pdf-font.py dist/files/Paul-Tradecraft-OnePager.pdf || { echo "FAIL PDF CJK font check"; exit 1; }
          grep -q '<title>' dist/index.html && echo "OK <title> present" || { echo "FAIL <title> missing"; exit 1; }
          grep -q 'og:image' dist/index.html && echo "OK og:image present" || { echo "FAIL og:image missing"; exit 1; }
          echo "== All health checks passed =="
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
