name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install CJK fonts (fast apt with IPv4)
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y -qq --no-install-recommends fonts-noto-cjk
          fc-list | grep -i noto | head -3
      - name: Cache Chrome binary
        id: cache-chrome
        uses: actions/cache@v4
        with:
          path: .chrome/chrome-linux64
          key: chrome-linux64-${{ runner.os }}
      - name: Download headless Chrome (fast, no snap)
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          mkdir -p .chrome
          curl -sL -o /tmp/cft.json "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          CHROME_URL=$(node -e "const j=require('/tmp/cft.json');console.log(j.channels.Stable.downloads.chrome.find(d=>d.platform==='linux64').url)")
          echo "CHROME_URL=$CHROME_URL" >> "$GITHUB_ENV"
          curl -sL -o .chrome/chrome.zip "$CHROME_URL"
          cd .chrome && unzip -q chrome.zip && rm chrome.zip && cd ..
          ls .chrome/chrome-linux64/chrome
      - name: Generate one-pager PDF (data-driven)
        run: node scripts/make-onepager.mjs
        env:
          CHROME_PATH: ${{ github.workspace }}/.chrome/chrome-linux64/chrome
      - name: Build
        run: npm run build
      - name: Health check before deploy (fail fast)
        run: |
          set -e
          echo "== Checking dist artifacts =="
          test -f dist/robots.txt && echo "OK robots.txt" || { echo "FAIL robots.txt missing"; exit 1; }
          test -f dist/sitemap.xml && echo "OK sitemap.xml" || { echo "FAIL sitemap.xml missing"; exit 1; }
          test -f dist/files/Paul-Tradecraft-OnePager.pdf && echo "OK one-pager.pdf" || { echo "FAIL one-pager.pdf missing"; exit 1; }
          SIZE=$(stat -c%s dist/files/Paul-Tradecraft-OnePager.pdf)
          echo "one-pager.pdf size: $SIZE bytes"
          test "$SIZE" -gt 10240 || { echo "FAIL one-pager.pdf too small (possibly blank render)"; exit 1; }
          grep -q '<title>' dist/index.html && echo "OK <title> present" || { echo "FAIL <title> missing"; exit 1; }
          grep -q 'og:image' dist/index.html && echo "OK og:image present" || { echo "FAIL og:image missing"; exit 1; }
          echo "== All health checks passed =="
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
