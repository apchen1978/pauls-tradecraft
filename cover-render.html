<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";
    src: url("file:///C:/Users/grays/Documents/DeepSeek-Test/portfolio-overview/public/fonts/geist-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 800px; height: 450px; overflow: hidden; font-family: "Geist", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  .cover { position: relative; width: 800px; height: 450px; display: flex; flex-direction: column; justify-content: space-between; padding: 44px 48px; color: #fff; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: var(--grad); }
  .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 85% -10%, rgba(255,255,255,0.16), transparent 55%); }
  .deco { position: absolute; border: 1.5px solid rgba(255,255,255,0.14); border-radius: 50%; }
  .deco.d1 { width: 340px; height: 340px; right: -90px; top: -110px; }
  .deco.d2 { width: 220px; height: 220px; right: 40px; bottom: -80px; border-color: rgba(255,255,255,0.10); }
  .deco.d3 { width: 90px; height: 90px; right: 200px; top: 60px; border-color: rgba(255,255,255,0.18); }
  .grid-lines { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 56px 56px; }
  .top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.75); }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; padding: 5px 12px; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.08); backdrop-filter: blur(6px); }
  .main { position: relative; }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent, #e8c48a); margin-bottom: 14px; }
  .title { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; max-width: 640px; }
  .sub { margin-top: 12px; font-size: 15px; font-weight: 400; color: rgba(255,255,255,0.74); max-width: 560px; line-height: 1.5; }
  .bottom { position: relative; display: flex; justify-content: space-between; align-items: flex-end; }
  .meta { font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7dd3a0; box-shadow: 0 0 10px rgba(125,211,160,0.7); }
  /* ---- Gaming 元素 ---- */
  .game-hud { position: absolute; top: 30px; right: 44px; display: flex; gap: 8px; }
  .game-hud span { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 4px; background: rgba(0,0,0,0.35); color: var(--accent); border: 1px solid rgba(255,255,255,0.18); font-variant-numeric: tabular-nums; }
  .keys { position: absolute; right: 52px; bottom: 58px; display: grid; grid-template-columns: repeat(3, 34px); gap: 6px; transform: rotate(-6deg); opacity: 0.9; }
  .key { width: 34px; height: 34px; border-radius: 6px; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.28); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.85); box-shadow: 0 3px 0 rgba(0,0,0,0.35); }
  .key.k-w { grid-column: 2; background: rgba(125,211,160,0.16); border-color: rgba(125,211,160,0.7); color: #7dd3a0; box-shadow: 0 3px 0 rgba(125,211,160,0.25), 0 0 14px rgba(125,211,160,0.35); }
  .key.k-a { grid-column: 1; grid-row: 2; }
  .key.k-s { grid-column: 2; grid-row: 2; }
  .key.k-d { grid-column: 3; grid-row: 2; }
  .key.k-space { grid-column: 1 / 4; grid-row: 3; width: auto; height: 22px; font-size: 9px; letter-spacing: 0.2em; color: rgba(255,255,255,0.5); }
  .scanlines { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px); opacity: 0.5; }
  .neon-glow { text-shadow: 0 0 18px rgba(125,211,160,0.55), 0 0 42px rgba(125,211,160,0.28); }
  .corner { position: absolute; width: 26px; height: 26px; border-color: rgba(255,255,255,0.5); }
  .corner.tl { top: 22px; left: 22px; border-top: 2px solid; border-left: 2px solid; }
  .corner.tr { top: 22px; right: 22px; border-top: 2px solid; border-right: 2px solid; }
  .corner.bl { bottom: 22px; left: 22px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner.br { bottom: 22px; right: 22px; border-bottom: 2px solid; border-right: 2px solid; }
</style>
</head>
<body>
<div class="cover" style="--grad: linear-gradient(135deg,#1f4d3a,#17271f); --accent: #e8c48a;">
  <div class="bg"></div>
  <div class="grid-lines"></div>
  <div class="deco d1"></div><div class="deco d2"></div><div class="deco d3"></div>
  <div class="scanlines" id="scanlines" style="display:none"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="game-hud" id="game-hud" style="display:none">
    <span id="hud-score">SCORE 042880</span>
    <span id="hud-combo">COMBO ×12</span>
    <span id="hud-wpm">WPM 86</span>
  </div>
  <div class="keys" id="game-keys" style="display:none">
    <div class="key k-w">W</div>
    <div class="key k-a">A</div>
    <div class="key k-s">S</div>
    <div class="key k-d">D</div>
    <div class="key k-space">SPACE</div>
  </div>
  <div class="top">
    <span class="brand">Paul's Tradecraft</span>
    <span class="badge">PROJECT</span>
  </div>
  <div class="main">
    <div class="kicker">CASE STUDY</div>
    <div class="title">Project Title</div>
    <div class="sub">Description</div>
  </div>
  <div class="bottom">
    <span class="meta">2026</span>
    <span class="status"><span class="dot"></span>Verified</span>
  </div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const g = p.get('grad') || 'linear-gradient(135deg,#1f4d3a,#17271f)';
  const accent = p.get('accent') || '#e8c48a';
  document.querySelector('.cover').style.setProperty('--grad', g);
  document.querySelector('.cover').style.setProperty('--accent', accent);
  document.querySelector('.brand').textContent = p.get('brand') || "Paul's Tradecraft";
  document.querySelector('.badge').textContent = p.get('badge') || 'PROJECT';
  document.querySelector('.kicker').textContent = p.get('kicker') || 'CASE STUDY';
  document.querySelector('.title').textContent = p.get('title') || 'Project Title';
  document.querySelector('.sub').textContent = p.get('sub') || 'Description';
  document.querySelector('.meta').textContent = p.get('meta') || '2026';
  document.querySelector('.status').lastChild.textContent = p.get('status') || 'Verified';
  // Gaming 變體：顯示 HUD / 鍵盤 / 掃描線，標題加霓虹
  if (p.get('gaming') === '1') {
    document.getElementById('scanlines').style.display = 'block';
    document.getElementById('game-hud').style.display = 'flex';
    document.getElementById('game-keys').style.display = 'grid';
    document.querySelector('.title').classList.add('neon-glow');
    if (p.get('hud')) {
      const parts = p.get('hud').split(',');
      if (parts[0]) document.getElementById('hud-score').textContent = parts[0];
      if (parts[1]) document.getElementById('hud-combo').textContent = parts[1];
      if (parts[2]) document.getElementById('hud-wpm').textContent = parts[2];
    }
  }
</script>
</body>
</html>
