<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --forest: #1f4d3a; --gold: #d9bf8c; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--forest); color: #fff;
    font-family: Georgia, "Times New Roman", "Noto Serif TC", "PMingLiU", serif;
  }
  .card {
    width: 1200px; height: 630px; padding: 0 96px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .title { font-size: 84px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; }
  .sub { margin-top: 30px; font-size: 31px; line-height: 1.4; color: var(--gold); letter-spacing: 0.005em; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Paul's Tradecraft</div>
    <div class="sub">Business judgment · Workflow design<br>Global business development</div>
  </div>
</body>
</html>
