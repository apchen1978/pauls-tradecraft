<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist Variable";
    src: url("public/fonts/geist-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  :root {
    --bone: #f4f5f0;
    --paper: #ecefe6;
    --ink: #17271f;
    --forest: #1f4d3a;
    --moss: #3a6b52;
    --amber: #a05a10;
    --gold: #c9973f;
    --line: #d9ded4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1440px; height: 810px; overflow: hidden;
    font-family: "Geist Variable", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bone); color: var(--ink);
  }
  .cover {
    position: relative; width: 1440px; height: 810px;
    padding: 48px 72px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* 網格紋理 */
  .grid {
    position: absolute; inset: 0; opacity: 0.05;
    background-image: linear-gradient(rgba(23,39,31,0.6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23,39,31,0.6) 1px, transparent 1px);
    background-size: 56px 56px; pointer-events: none;
  }
  .deco {
    position: absolute; border: 1.5px solid rgba(31,77,58,0.10); border-radius: 50%;
  }
  .deco.d1 { width: 360px; height: 360px; right: -110px; top: -130px; }
  .deco.d2 { width: 220px; height: 220px; left: -70px; bottom: -90px; border-color: rgba(160,90,16,0.10); }

  .top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: var(--moss); }
  .kicker { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--amber); }

  .main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 20px; }
  .title {
    font-size: 84px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05;
    color: var(--forest); max-width: 1100px;
  }
  html[lang="zh-Hant"] .title { font-size: 76px; line-height: 1.18; letter-spacing: -0.01em; max-width: 1160px; }
  .flow {
    display: flex; align-items: center; gap: 24px; margin-top: 44px; flex-wrap: nowrap;
  }
  .flow .step { display: flex; align-items: center; gap: 10px; }
  .flow .num {
    font-size: 72px; font-weight: 800; line-height: 1; letter-spacing: -0.03em;
    color: var(--forest); font-variant-numeric: tabular-nums;
  }
  .flow .num.gold { color: var(--amber); }
  .flow .lbl { font-size: 20px; font-weight: 600; color: var(--moss); max-width: 160px; line-height: 1.2; }
  .flow .arrow { font-size: 36px; color: var(--gold); font-weight: 700; }

  .chips { display: flex; gap: 16px; margin-top: 48px; flex-wrap: nowrap; }
  .chip {
    border: 1px solid var(--line); border-radius: 12px; background: #fff;
    padding: 16px 24px; min-width: 200px;
  }
  .chip .k { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: var(--moss); }
    .chip .v { font-size: 22px; font-weight: 700; margin-top: 5px; color: var(--ink); }
  .chip.amber { border-color: #e3cdb0; background: #fbf6ee; }
  .chip.amber .v { color: var(--amber); }

  .bottom { position: relative; display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 24px; }
  .tagline { font-size: 17px; font-weight: 600; color: var(--moss); }
  .disclaimer { font-size: 12px; color: #8a958d; text-align: right; max-width: 640px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="cover">
    <div class="grid"></div>
    <div class="deco d1"></div>
    <div class="deco d2"></div>

    <div class="top">
      <span class="brand">Paul's Tradecraft</span>
      <span class="kicker" data-k="kicker"></span>
    </div>

    <div class="main">
      <div class="title" data-k="title"></div>

      <div class="flow">
        <div class="step">
          <span class="num">44</span>
          <span class="lbl" data-k="found"></span>
        </div>
        <span class="arrow">→</span>
        <div class="step">
          <span class="lbl" data-k="check"></span>
        </div>
        <span class="arrow">→</span>
        <div class="step">
          <span class="num gold">20</span>
          <span class="lbl" data-k="qualified"></span>
        </div>
      </div>

      <div class="chips">
        <div class="chip"><div class="k" data-k="c1k"></div><div class="v" data-k="c1v"></div></div>
        <div class="chip"><div class="k" data-k="c2k"></div><div class="v" data-k="c2v"></div></div>
        <div class="chip amber"><div class="k" data-k="c3k"></div><div class="v" data-k="c3v"></div></div>
        <div class="chip"><div class="k" data-k="c4k"></div><div class="v" data-k="c4v"></div></div>
      </div>
    </div>

    <div class="bottom">
      <span class="tagline" data-k="tagline"></span>
      <span class="disclaimer" data-k="disclaimer"></span>
    </div>
  </div>
  <script>
    // ?lang=zh or ?lang=en (default en). The same layout renders both covers.
    const COPY = {
      en: {
        kicker: "Reach first, then decide",
        title: "Who should we reach first?",
        found: "found", check: "evidence<br>check", qualified: "qualified",
        c1k: "Why", c1v: "sourced reasons",
        c2k: "Why not", c2v: "contradictions shown",
        c3k: "Not public", c3v: "marked, not guessed",
        c4k: "Next", c4v: "a person decides",
        tagline: "Find the people first. Then judge the deal.",
        disclaimer: "Representative and demo records · public-web research · no outreach performed",
      },
      zh: {
        kicker: "先找到人，再判斷能不能接",
        title: "還沒談條件之前，<br>該先接觸誰？",
        found: "家候選", check: "證據<br>檢視", qualified: "家合格",
        c1k: "為什麼值得", c1v: "有來源的理由",
        c2k: "為什麼不值得", c2v: "矛盾證據一併列出",
        c3k: "查無公開資料", c3v: "標示出來，不用猜",
        c4k: "下一步", c4v: "由人決定",
        tagline: "先找到人，再判斷這單能不能接。",
        disclaimer: "代表性與示範紀錄 · 公開網頁研究 · 未進行主動接觸",
      },
    };
    const lang = new URLSearchParams(location.search).get("lang") === "zh" ? "zh" : "en";
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    for (const node of document.querySelectorAll("[data-k]")) node.innerHTML = COPY[lang][node.dataset.k];
  </script>
</body>
</html>
