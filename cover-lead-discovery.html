<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist Variable";
    src: url("public/fonts/geist-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  :root {
    --bone: #F6F3ED;
    --ink: #193A35;
    --moss: #62716A;
    --amber: #8A6A2B;
    --amber-deep: #765A24;
    --gold: #B89966;
    --line: #D4DAD1;
    --serif: Georgia, "Songti TC", "PMingLiU", "Noto Serif CJK TC", "Noto Serif TC", serif;
    --sans: "Geist Variable", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1440px; height: 810px; overflow: hidden; background: var(--bone); color: var(--ink); font-family: var(--sans); }
  .cover { width: 1440px; height: 810px; padding: 64px 84px 52px; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 24px; font-family: var(--serif); font-size: 22px; }
  .brand .rule { flex: 1; height: 1px; background: var(--amber); }
  .brand .kicker { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--amber); }

  .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; }
  .title { font-family: var(--serif); font-size: 88px; font-weight: 600; line-height: 1.16; letter-spacing: -0.025em; text-wrap: balance; }
  html[lang="zh-Hant"] .title { font-size: 66px; line-height: 1.34; letter-spacing: 0; white-space: nowrap; }
  .tagline { margin-top: 36px; font-size: 24px; line-height: 1.5; color: var(--amber); text-wrap: balance; max-width: 520px; }

  .slip { display: flex; flex-direction: column; }
  .funnel { display: flex; align-items: baseline; gap: 22px; padding-bottom: 28px; border-bottom: 1px solid var(--amber); }
  .funnel .num { font-family: var(--serif); font-size: 128px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .funnel .num.gold { color: var(--amber-deep); }
  .funnel .lbl { font-size: 19px; line-height: 1.3; color: var(--moss); white-space: nowrap; }
  .funnel .mid { display: flex; flex-direction: column; align-items: center; gap: 6px; align-self: center; }
  .funnel .mid .lbl { font-size: 14px; }
  .funnel .arrow { font-family: var(--serif); font-size: 44px; line-height: 1; color: var(--gold); }
  .funnel .step { display: flex; align-items: baseline; gap: 12px; }

  .ledger { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 190px 1fr; align-items: baseline; gap: 20px; padding: 17px 0; border-bottom: 1px solid var(--line); }
  .row .k { font-size: 16px; line-height: 1.35; color: var(--moss); }
  .row .v { font-family: var(--serif); font-size: 27px; line-height: 1.3; }
  .row.amber .k, .row.amber .v { color: var(--amber-deep); }

  .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 48px; padding-top: 20px; }
  .foot .disclosure { font-size: 14px; line-height: 1.5; color: var(--amber); }
  .foot .tag { font-family: var(--serif); font-size: 17px; color: var(--moss); white-space: nowrap; }
</style>
</head>
<body>
  <div class="cover">
    <div class="brand"><span>Paul's Tradecraft</span><span class="rule"></span><span class="kicker" data-k="kicker"></span></div>

    <div class="main">
      <div>
        <div class="title" data-k="title"></div>
        <div class="tagline" data-k="tagline"></div>
      </div>
      <div class="slip">
        <div class="funnel">
          <div class="step"><span class="num">44</span><span class="lbl" data-k="found"></span></div>
          <div class="mid"><span class="arrow">→</span><span class="lbl" data-k="check"></span></div>
          <div class="step"><span class="num gold">20</span><span class="lbl" data-k="qualified"></span></div>
        </div>
        <div class="ledger">
          <div class="row"><span class="k" data-k="c1k"></span><span class="v" data-k="c1v"></span></div>
          <div class="row"><span class="k" data-k="c2k"></span><span class="v" data-k="c2v"></span></div>
          <div class="row amber"><span class="k" data-k="c3k"></span><span class="v" data-k="c3v"></span></div>
          <div class="row"><span class="k" data-k="c4k"></span><span class="v" data-k="c4v"></span></div>
        </div>
      </div>
    </div>

    <div class="foot"><span class="disclosure" data-k="disclaimer"></span></div>
  </div>
  <script>
    // ?lang=zh or ?lang=en (default en). The same layout renders both covers.
    // Copy is unchanged from the previous cover; only the layout moved to the editorial style.
    const COPY = {
      en: {
        kicker: "Reach first, then decide",
        title: "Who should we reach first?",
        tagline: "Find the people first. Then judge the deal.",
        found: "found", check: "evidence check", qualified: "qualified",
        c1k: "Why", c1v: "sourced reasons",
        c2k: "Why not", c2v: "contradictions shown",
        c3k: "Not public", c3v: "marked, not guessed",
        c4k: "Next", c4v: "a person decides",
        disclaimer: "Representative and demo records · public-web research · no outreach performed",
      },
      zh: {
        kicker: "先找到人，再判斷能不能接",
        title: "還沒談條件之前，<br>該先接觸誰？",
        tagline: "先找到人，再判斷這單能不能接。",
        found: "家候選", check: "證據檢視", qualified: "家合格",
        c1k: "為什麼值得", c1v: "有來源的理由",
        c2k: "為什麼不值得", c2v: "矛盾證據一併列出",
        c3k: "查無公開資料", c3v: "標示出來，不用猜",
        c4k: "下一步", c4v: "由人決定",
        disclaimer: "代表性與示範紀錄 · 公開網頁研究 · 未進行主動接觸",
      },
    };
    const lang = new URLSearchParams(location.search).get("lang") === "zh" ? "zh" : "en";
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    for (const node of document.querySelectorAll("[data-k]")) node.innerHTML = COPY[lang][node.dataset.k];
  </script>
</body>
</html>
